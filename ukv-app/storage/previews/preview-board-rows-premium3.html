<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Availability board — premium concepts III</title>
<style>
  :root{--wa:#25D366;--mono:ui-monospace,SFMono-Regular,Menlo,'Courier New',monospace;--av:#1F6E63;--lim:#b5791f;--vl:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#050f0d;color:#e7efee;padding:28px 16px 90px}
  .wrap{max-width:780px;margin:0 auto}
  h1{font-size:16px;color:#8fe3c9;font-weight:800;margin-bottom:3px}.sub{font-size:12px;color:#6f8f89;margin-bottom:18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 15px;border:1px solid #1e3a3f;background:transparent;border-radius:100px;font:600 12.5px 'Outfit',sans-serif;color:#7f9b96;cursor:pointer}
  .tab.on{background:#12312e;border-color:#2f9e8f;color:#bff0e2}
  .panel{display:none}.panel.on{display:block}
  .wa-svg{width:14px;height:14px;fill:currentColor;flex:none}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}@keyframes rp{0%,100%{opacity:1}50%{opacity:.45}}

  /* ===== G — HERO SPOTLIGHT ===== */
  .G .hero{background:linear-gradient(135deg,#123f36,#0c2621);border:1px solid #1d453c;border-radius:18px;padding:22px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative;overflow:hidden;margin-bottom:12px}
  .G .hero::after{content:'FR';position:absolute;right:-10px;bottom:-30px;font:900 130px var(--mono);color:rgba(255,255,255,.04)}
  .G .hi{flex:1;min-width:200px}
  .G .hk{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#e9c46a;margin-bottom:8px}
  .G .hcn{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1}
  .G .hnx{font-size:12.5px;color:#7fb0a6;margin-top:8px}.G .hnx b{color:#bfe6dc}
  .G .hpill{display:inline-block;margin-top:12px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5fd4a6;background:rgba(63,185,132,.14);padding:5px 12px;border-radius:100px}
  .G .hr{text-align:right}
  .G .hn{font-family:var(--mono);font-size:64px;font-weight:900;letter-spacing:-.05em;line-height:.9;color:#7fe0b6}
  .G .hnl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#5c837c;margin:2px 0 12px}
  .G .hcta{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#04140b;font:800 14px 'Outfit',sans-serif;padding:12px 22px;border-radius:11px;box-shadow:0 12px 26px -12px rgba(37,211,102,.6)}
  .G .hcta .wa-svg{width:18px;height:18px}
  .G .list{background:#0a1613;border:1px solid #16302a;border-radius:16px;overflow:hidden}
  .G .row{display:grid;grid-template-columns:46px 1fr auto 54px auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid #0c1c18;color:#cfe0dc;text-decoration:none}
  .G .row:first-of-type{border-top:none}.G .row:hover{background:#0c1f1a}
  .G .code{font-family:var(--mono);font-weight:800;font-size:12px;color:#8fb7b1;background:#0e2621;border:1px solid #1a3b34;border-radius:7px;padding:7px 0;text-align:center}
  .G .cn{font-weight:700;font-size:14.5px;color:#eaf3f1}.G .nx{font-size:11px;color:#4d6d67;margin-top:1px}.G .nx b{color:#8fb7b1}
  .G .st{justify-self:start;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .G .st::before{content:'';width:7px;height:7px;border-radius:50%}
  .G .limited .st{color:#e9c46a}.G .limited .st::before{background:#e9c46a}.G .very-limited .st{color:#ef5b4c}.G .very-limited .st::before{background:#ef5b4c;box-shadow:0 0 6px #ef5b4c;animation:rp 1.3s infinite}.G .available .st{color:#3fb984}.G .available .st::before{background:#3fb984}
  .G .num{text-align:right}.G .n{font-family:var(--mono);font-size:22px;font-weight:800;line-height:1}.G .limited .n{color:#f2d38a}.G .very-limited .n{color:#fca5a5}.G .available .n{color:#6ee7b7}
  .G .nl{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:#3a5a52;margin-top:2px}
  .G .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 11.5px 'Outfit',sans-serif;padding:8px 13px;border-radius:8px;white-space:nowrap}

  /* ===== H — OPS MONITOR (dark neon) ===== */
  .H .board{background:#070f14;border:1px solid #10222e;border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -40px #000}
  .H .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid #0e202b}
  .H .ttl{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:#4d7d95}
  .H .live{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#00e0a0;display:flex;align-items:center;gap:6px}
  .H .ld{width:7px;height:7px;border-radius:50%;background:#00e0a0;box-shadow:0 0 8px #00e0a0;animation:pl 1.6s infinite}
  .H .row{display:grid;grid-template-columns:4px 44px 1fr 70px 58px auto;gap:14px;align-items:center;padding:13px 18px 13px 0;border-top:1px solid #0b1a23;color:#c3d4dd;text-decoration:none}
  .H .row:first-of-type{border-top:none}.H .row:hover{background:#0a1620}
  .H .bar{width:4px;align-self:stretch;border-radius:0 3px 3px 0}
  .H .available .bar{background:#00e0a0;box-shadow:0 0 14px #00e0a0}.H .limited .bar{background:#ffc94d;box-shadow:0 0 12px #ffc94d}.H .very-limited .bar{background:#ff5a4d;box-shadow:0 0 14px #ff5a4d}
  .H .code{font-family:var(--mono);font-weight:800;font-size:12px;color:#7fd3c4;background:#0c2029;border:1px solid #143240;border-radius:6px;padding:7px 0;text-align:center}
  .H .cn{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.03em;color:#e5f0f4}.H .nx{font-size:11px;color:#3f6274;margin-top:2px}.H .nx b{color:#8fb3c4}
  .H .spark{display:flex;align-items:flex-end;gap:2px;height:22px}
  .H .spark i{width:4px;border-radius:1px;opacity:.85}
  .H .available .spark i{background:#00e0a0}.H .limited .spark i{background:#ffc94d}.H .very-limited .spark i{background:#ff5a4d}
  .H .num{text-align:right}.H .n{font-family:var(--mono);font-size:26px;font-weight:900;line-height:1;letter-spacing:-.03em}
  .H .available .n{color:#5cf3c6}.H .limited .n{color:#ffd980}.H .very-limited .n{color:#ff8f86;animation:rp 1.3s infinite}
  .H .nl{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#33566a;margin-top:2px;font-family:var(--mono)}
  .H .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 14px;border-radius:8px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  /* ===== I — RIBBON CARDS (2-up) ===== */
  .I .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.I .grid{grid-template-columns:1fr}}
  .I .card{position:relative;background:#fff;border:1px solid #dde3ec;border-radius:15px;padding:16px 16px 14px;overflow:hidden;color:#16222E;text-decoration:none;box-shadow:0 18px 40px -30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
  .I .rib{position:absolute;top:13px;right:-34px;transform:rotate(45deg);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:4px 40px}
  .I .available .rib{background:#1F6E63}.I .limited .rib{background:#b5791f}.I .very-limited .rib{background:#c0392b}
  .I .top{display:flex;align-items:center;gap:10px}
  .I .code{font-family:var(--mono);font-weight:800;font-size:12px;color:#5d6b76;background:#f2f5f8;border:1px solid #e3e8ee;border-radius:8px;padding:8px 10px}
  .I .cn{font-weight:800;font-size:16px}
  .I .nx{font-size:11.5px;color:#5d6b76}.I .nx b{color:#1F6E63}
  .I .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
  .I .num{line-height:1}.I .n{font-family:var(--mono);font-size:34px;font-weight:900;letter-spacing:-.04em}
  .I .available .n{color:#1F6E63}.I .limited .n{color:#b5791f}.I .very-limited .n{color:#c0392b}
  .I .nl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#5d6b76;margin-top:2px}
  .I .cta{display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 14px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  @media(max-width:560px){
    .G .hero{flex-direction:column;align-items:flex-start;gap:14px}.G .hr{text-align:left}.G .hn{font-size:54px}
    .G .row,.H .row{grid-template-columns:44px 1fr auto;grid-template-areas:'code name num' 'code st cta';gap:8px 12px;padding-left:14px}
    .H .row{grid-template-columns:4px 40px 1fr auto;grid-template-areas:'bar code name num' 'bar code st cta'}
    .info{grid-area:name;min-width:0}.st,.spark{grid-area:st;align-self:center}.num{grid-area:num}
    .G .cta,.H .cta{grid-area:cta;justify-self:end;align-self:center}.H .bar{grid-area:bar}
    .H .spark{display:none}
  }
</style></head><body><div class="wrap">
  <h1>Availability board — premium concepts III</h1>
  <p class="sub">Spotlight hierarchy · live ops-monitor · boutique ribbon cards</p>
  <div class="tabs">
    <button class="tab on" onclick="sw(0)">G — Hero Spotlight</button>
    <button class="tab" onclick="sw(1)">H — Ops Monitor</button>
    <button class="tab" onclick="sw(2)">I — Ribbon Cards</button>
  </div>

  <div class="panel on G">
    <div class="hero">
      <div class="hi"><div class="hk">◆ Widest availability now</div><div class="hcn">France</div><div class="hnx">Next: <b>3rd Week Aug 2026</b> · London · Manchester · Edinburgh</div><span class="hpill">Available</span></div>
      <div class="hr"><div class="hn">48</div><div class="hnl">slots open</div><a class="hcta" href="#"><svg class="wa-svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>Secure France now</a></div>
    </div>
    <div class="list" id="G"></div>
  </div>

  <div class="panel H"><div class="board">
    <div class="hd"><span class="ttl">SCHENGEN · LIVE STATUS</span><span class="live"><span class="ld"></span>LIVE · 63 OPEN</span></div>
    <div id="H"></div>
  </div></div>

  <div class="panel I"><div class="grid" id="I"></div></div>
</div>
<script>
  var WA='<svg class="wa-svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var ALL=[
    ['France','FR','available',48,'3rd Week Aug 2026'],['Netherlands','NL','limited',2,'3rd Week Aug 2026'],
    ['Iceland','IS','limited',2,'4th Week Aug 2026'],['Hungary','HU','limited',2,'3rd Week Sep 2026'],
    ['Poland','PL','very-limited',4,'Next Week Aug 2026'],['Portugal','PT','very-limited',1,'Next Week Aug 2026'],
    ['Norway','NO','very-limited',1,'3rd Week Aug 2026'],['Switzerland','CH','very-limited',1,'2nd Week Sep 2026'],
    ['Italy','IT','very-limited',1,'3rd Week Sep 2026'],['Liechtenstein','LI','very-limited',1,'2nd Week Sep 2026']
  ];
  var L={available:'Available',limited:'Limited','very-limited':'Very limited'};
  function sl(n){return n==1?'slot':'slots';}
  var G=ALL.slice(1); // hero pulls France out
  function spark(seed){var b='';for(var k=0;k<7;k++){var h=6+((seed*7+k*13)%16);b+='<i style="height:'+h+'px"></i>';}return b;}
  document.getElementById('G').innerHTML=G.map(function(c){return '<a class="row '+c[2]+'" href="#"><span class="code">'+c[1]+'</span><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><span class="st">'+L[c[2]]+'</span><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div></div><span class="cta">'+WA+'Secure</span></a>';}).join('');
  document.getElementById('H').innerHTML=ALL.map(function(c,i){return '<a class="row '+c[2]+'" href="#"><span class="bar"></span><span class="code">'+c[1]+'</span><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><div class="spark">'+spark(i+1)+'</div><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('I').innerHTML=ALL.map(function(c){return '<a class="card '+c[2]+'" href="#"><span class="rib">'+L[c[2]]+'</span><div class="top"><span class="code">'+c[1]+'</span><span class="cn">'+c[0]+'</span></div><div class="nx">Next: <b>'+c[4]+'</b></div><div class="bot"><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+' open</div></div><span class="cta">'+WA+'Secure now</span></div></a>';}).join('');
  function sw(i){document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('on',j===i);});document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('on',j===i);});}
</script>
</body></html>
