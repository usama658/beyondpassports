<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Availability board — bold premium concepts</title>
<style>
  :root{--wa:#25D366;--mono:ui-monospace,SFMono-Regular,Menlo,'Courier New',monospace;
        --av:#1F6E63;--lim:#b5791f;--vl:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#05100e;color:#e7efee;padding:28px 16px 90px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:16px;color:#8fe3c9;font-weight:800;margin-bottom:3px}
  .sub{font-size:12px;color:#6f8f89;margin-bottom:18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 15px;border:1px solid #1e3a3f;background:transparent;border-radius:100px;font:600 12.5px 'Outfit',sans-serif;color:#7f9b96;cursor:pointer}
  .tab.on{background:#12312e;border-color:#2f9e8f;color:#bff0e2}
  .panel{display:none}.panel.on{display:block}
  .wa-svg{width:14px;height:14px;fill:currentColor;flex:none}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes rp{0%,100%{opacity:1}50%{opacity:.45}}

  /* ===== D — TERMINAL (split-flap) ===== */
  .D .board{background:#0a1613;border:1px solid #16302a;border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -40px #000, inset 0 1px 0 rgba(255,255,255,.03)}
  .D .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;background:linear-gradient(#0c1a16,#0a1613);border-bottom:1px solid #14322b}
  .D .ttl{font-family:var(--mono);font-size:12px;font-weight:800;letter-spacing:.22em;color:#e9c46a}
  .D .rt{display:flex;align-items:center;gap:12px}
  .D .tick{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#3fb984;display:flex;align-items:center;gap:6px}
  .D .dot{width:7px;height:7px;border-radius:50%;background:#3fb984;box-shadow:0 0 8px #3fb984;animation:pl 2s infinite}
  .D .peak{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#e9c46a;border:1px solid rgba(233,196,106,.3);border-radius:4px;padding:3px 8px}
  .D .colh{display:grid;grid-template-columns:56px 1fr 96px 66px auto;gap:14px;padding:9px 20px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#3a5a52;border-bottom:1px solid #0e241f;text-transform:uppercase}
  .D .row{display:grid;grid-template-columns:56px 1fr 96px 66px auto;gap:14px;align-items:center;padding:13px 20px;border-bottom:1px solid #0b1d19;color:#cfe0dc;text-decoration:none}
  .D .row:hover{background:#0c1f1a}
  .D .code{font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:.05em;color:#0a0f0e;background:#e9c46a;border-radius:4px;padding:6px 0;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
  .D .cn{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.04em;color:#eaf3f1}
  .D .nx{font-size:11px;color:#4d6d67;margin-top:2px}.D .nx b{color:#8fb7b1;font-weight:600}
  .D .st{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .D .st::before{content:'';width:7px;height:7px;border-radius:50%}
  .D .available .st{color:#3fb984}.D .available .st::before{background:#3fb984;box-shadow:0 0 7px #3fb984}
  .D .limited .st{color:#e9c46a}.D .limited .st::before{background:#e9c46a;box-shadow:0 0 7px #e9c46a}
  .D .very-limited .st{color:#ef5b4c}.D .very-limited .st::before{background:#ef5b4c;box-shadow:0 0 7px #ef5b4c;animation:rp 1.2s infinite}
  .D .num{text-align:right}.D .n{font-family:var(--mono);font-size:28px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .D .available .n{color:#6ee7b7}.D .limited .n{color:#f2d38a}.D .very-limited .n{color:#fca5a5}
  .D .nl{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#3a5a52;margin-top:2px}
  .D .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 15px;border-radius:8px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  /* ===== E — SCARCITY METER ===== */
  .E .board{background:#fff;border:1px solid #dde3ec;border-radius:18px;overflow:hidden;box-shadow:0 40px 80px -40px #000;color:#16222E}
  .E .hd{padding:16px 20px;border-bottom:1px solid #eef1f4;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .E .ey{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#1F6E63}
  .E .tick{font-size:12px;font-weight:700;color:#1F6E63;display:flex;align-items:center;gap:7px}
  .E .dot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa);animation:pl 2s infinite}
  .E .row{display:grid;grid-template-columns:38px 1fr 150px 54px auto;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid #f0f2f5;color:#16222E;text-decoration:none}
  .E .row:first-of-type{border-top:none}
  .E .code{font-family:var(--mono);font-weight:800;font-size:12px;color:#5d6b76;background:#f2f5f8;border:1px solid #e3e8ee;border-radius:7px;padding:7px 0;text-align:center}
  .E .cn{font-weight:800;font-size:15.5px}.E .nx{font-size:11.5px;color:#5d6b76;margin-top:1px}.E .nx b{color:#1F6E63}
  .E .meter{display:flex;flex-direction:column;gap:5px}
  .E .mtrk{height:7px;border-radius:4px;background:#eef1f4;overflow:hidden}
  .E .mfl{height:100%;border-radius:4px}
  .E .available .mfl{background:linear-gradient(90deg,#2f9e7b,#1F6E63)}.E .limited .mfl{background:linear-gradient(90deg,#d0a24e,#b5791f)}.E .very-limited .mfl{background:linear-gradient(90deg,#d85647,#c0392b)}
  .E .mlbl{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .E .available .mlbl{color:#1F6E63}.E .limited .mlbl{color:#b5791f}.E .very-limited .mlbl{color:#c0392b}
  .E .num{text-align:right}.E .n{font-family:var(--mono);font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .E .available .n{color:#1F6E63}.E .limited .n{color:#b5791f}.E .very-limited .n{color:#c0392b}
  .E .nl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#5d6b76;margin-top:2px}
  .E .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 15px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  /* ===== F — PRIORITY ACCESS (luxe) ===== */
  .F .board{background:radial-gradient(120% 120% at 0 0,#123a34,#0a1f1c 60%);border:1px solid #1c3f38;border-radius:20px;padding:8px;box-shadow:0 40px 90px -40px #000}
  .F .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 12px}
  .F .ey{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#c9a24a}
  .F .tick{font-size:12px;color:#8fbdb4;display:flex;align-items:center;gap:7px}.F .dot{width:8px;height:8px;border-radius:50%;background:#c9a24a;box-shadow:0 0 8px #c9a24a;animation:pl 2s infinite}
  .F .row{display:grid;grid-template-columns:44px 1fr auto 60px auto;gap:15px;align-items:center;padding:15px 16px;margin:7px 0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(201,162,74,.14);border-radius:14px;color:#e6efec;text-decoration:none;transition:.15s}
  .F .row:hover{border-color:rgba(201,162,74,.4)}
  .F .code{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.05em;color:#c9a24a;border:1px solid rgba(201,162,74,.35);border-radius:9px;padding:9px 0;text-align:center}
  .F .cn{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:18px;letter-spacing:.01em;color:#f3f7f5}
  .F .nx{font-size:11.5px;color:#6f9a92;margin-top:2px}.F .nx b{color:#a9ccc4}
  .F .pill{justify-self:start;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;white-space:nowrap}
  .F .available .pill{background:rgba(63,185,132,.14);color:#5fd4a6}.F .limited .pill{background:rgba(233,196,106,.14);color:#e9c46a}.F .very-limited .pill{background:rgba(239,91,76,.14);color:#f0897c}
  .F .num{text-align:right}.F .n{font-family:var(--mono);font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .F .available .n{color:#7fe0b6}.F .limited .n{color:#f0d79b}.F .very-limited .n{color:#f5b0a6}
  .F .nl{font-size:8.5px;text-transform:uppercase;letter-spacing:.12em;color:#5c837c;margin-top:2px}
  .F .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#e7c063,#c9a24a);color:#231a05;font:800 12px 'Outfit',sans-serif;padding:9px 15px;border-radius:10px;white-space:nowrap;box-shadow:0 10px 22px -10px rgba(201,162,74,.6)}

  @media(max-width:560px){
    .D .colh{display:none}
    .D .row,.E .row,.F .row{grid-template-columns:46px 1fr auto;grid-template-areas:'code name num' 'code st cta';gap:8px 12px}
    .D .code,.E .code,.F .code{grid-area:code;align-self:start}
    .info{grid-area:name;min-width:0}.st,.meter,.pill{grid-area:st;align-self:center}.num{grid-area:num}
    .D .cta,.E .cta,.F .cta{grid-area:cta;justify-self:end;align-self:center}
    .E .meter{max-width:150px}
  }
</style></head><body><div class="wrap">
  <h1>Availability board — bold premium concepts</h1>
  <p class="sub">Stronger directions · airport-code chips · Beyond Passports palette · WhatsApp-native</p>
  <div class="tabs">
    <button class="tab on" onclick="sw(0)">D — Terminal</button>
    <button class="tab" onclick="sw(1)">E — Scarcity Meter</button>
    <button class="tab" onclick="sw(2)">F — Priority Access</button>
  </div>
  <div class="panel on D"><div class="board">
    <div class="hd"><span class="ttl">SCHENGEN · DEPARTURES</span><div class="rt"><span class="tick"><span class="dot"></span>63 OPEN NOW</span><span class="peak">⚡ SUMMER PEAK</span></div></div>
    <div class="colh"><span>Code</span><span>Destination</span><span>Status</span><span style="text-align:right">Slots</span><span></span></div>
    <div id="D"></div>
  </div></div>
  <div class="panel E"><div class="board">
    <div class="hd"><span class="ey">Schengen Appointment Availability</span><span class="tick"><span class="dot"></span>63 slots open now</span></div>
    <div id="E"></div>
  </div></div>
  <div class="panel F"><div class="board">
    <div class="hd"><span class="ey">Priority Appointment Access</span><span class="tick"><span class="dot"></span>63 open now</span></div>
    <div id="F"></div>
  </div></div>
</div>
<script>
  var WA='<svg class="wa-svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var D=[
    ['France','FR','available',48,'3rd Week Aug 2026'],['Netherlands','NL','limited',2,'3rd Week Aug 2026'],
    ['Iceland','IS','limited',2,'4th Week Aug 2026'],['Hungary','HU','limited',2,'3rd Week Sep 2026'],
    ['Poland','PL','very-limited',4,'Next Week Aug 2026'],['Portugal','PT','very-limited',1,'Next Week Aug 2026'],
    ['Norway','NO','very-limited',1,'3rd Week Aug 2026'],['Switzerland','CH','very-limited',1,'2nd Week Sep 2026'],
    ['Italy','IT','very-limited',1,'3rd Week Sep 2026'],['Liechtenstein','LI','very-limited',1,'2nd Week Sep 2026']
  ];
  var L={available:'Available',limited:'Limited','very-limited':'Very limited'};
  function sl(n){return n==1?'slot':'slots';}
  function pct(n){return Math.max(8,Math.min(100,Math.round(n/12*100)));}
  document.getElementById('D').innerHTML=D.map(function(c){return '<a class="row '+c[2]+'" href="#"><span class="code">'+c[1]+'</span><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><span class="st">'+L[c[2]]+'</span><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('E').innerHTML=D.map(function(c){return '<a class="row '+c[2]+'" href="#"><span class="code">'+c[1]+'</span><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><div class="meter"><div class="mtrk"><div class="mfl" style="width:'+pct(c[3])+'%"></div></div><span class="mlbl">'+L[c[2]]+'</span></div><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('F').innerHTML=D.map(function(c){return '<a class="row '+c[2]+'" href="#"><span class="code">'+c[1]+'</span><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><span class="pill">'+L[c[2]]+'</span><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+' left</div></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  function sw(i){document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('on',j===i);});document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('on',j===i);});}
</script>
</body></html>
