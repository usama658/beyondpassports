<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Availability board — premium concepts V</title>
<style>
  :root{--wa:#25D366;--mono:ui-monospace,SFMono-Regular,Menlo,'Courier New',monospace;--serif:'Georgia','Times New Roman',serif;--av:#1F6E63;--lim:#b5791f;--vl:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#0a1410;color:#e7efee;padding:28px 16px 90px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:16px;color:#8fe3c9;font-weight:800;margin-bottom:3px}.sub{font-size:12px;color:#6f8f89;margin-bottom:18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 15px;border:1px solid #1e3a3f;background:transparent;border-radius:100px;font:600 12.5px 'Outfit',sans-serif;color:#7f9b96;cursor:pointer}
  .tab.on{background:#12312e;border-color:#2f9e8f;color:#bff0e2}
  .panel{display:none}.panel.on{display:block}
  .wa-svg{width:14px;height:14px;fill:currentColor;flex:none}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}@keyframes rp{0%,100%{opacity:1}50%{opacity:.5}}

  /* ===== M — PASSPORT STAMPS ===== */
  .M .book{background:#efe7d6;background-image:radial-gradient(#e5dcc6 1px,transparent 1px);background-size:16px 16px;border:1px solid #d8ccb0;border-radius:16px;padding:22px 18px;box-shadow:0 40px 80px -40px #000}
  .M .bh{font-family:var(--serif);font-style:italic;color:#7a6f56;font-size:14px;text-align:center;margin-bottom:18px;letter-spacing:.02em}
  .M .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:640px){.M .grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:400px){.M .grid{grid-template-columns:1fr}}
  .M .stamp{display:block;text-decoration:none;text-align:center;padding:16px 10px 12px;border:2px solid;border-radius:12px;position:relative;transform:rotate(-2deg);transition:.15s;background:rgba(255,255,255,.35)}
  .M .stamp:nth-child(even){transform:rotate(1.6deg)}
  .M .stamp:hover{transform:rotate(0) scale(1.02)}
  .M .available{border-color:rgba(31,110,99,.55);color:#1F6E63}.M .limited{border-color:rgba(181,121,31,.55);color:#8f6413}.M .very-limited{border-color:rgba(192,57,43,.55);color:#a3311f}
  .M .arc{font-size:8px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
  .M .code{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.08em;margin-top:2px}
  .M .n{font-family:var(--mono);font-size:44px;font-weight:900;line-height:1;letter-spacing:-.04em;margin:4px 0 0}
  .M .nl{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
  .M .cn{font-family:var(--serif);font-weight:700;font-size:16px;margin-top:8px;color:#2a2418}
  .M .nx{font-size:10.5px;color:#7a6f56;margin-top:1px}
  .M .st{display:inline-block;margin-top:8px;font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;border:1px solid currentColor;border-radius:100px;padding:3px 9px}
  .M .cta{margin-top:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px;border-radius:9px;box-shadow:0 8px 18px -10px rgba(37,211,102,.6)}

  /* ===== N — VAULT DISPLAY ===== */
  .N .board{background:linear-gradient(180deg,#141a1e,#0c1014);border:1px solid #23303a;border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -40px #000, inset 0 1px 0 rgba(255,255,255,.05)}
  .N .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid #1c2830;background:linear-gradient(#161d22,#121820)}
  .N .ttl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#6a8593}
  .N .live{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#33d9a6;display:flex;align-items:center;gap:6px}
  .N .ld{width:7px;height:7px;border-radius:50%;background:#33d9a6;box-shadow:0 0 8px #33d9a6;animation:pl 1.6s infinite}
  .N .row{display:grid;grid-template-columns:52px 1fr auto 118px auto;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid #161f26;color:#c3d0d7;text-decoration:none}
  .N .row:first-of-type{border-top:none}.N .row:hover{background:#131b21}
  .N .code{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.05em;color:#93a8b4;background:#0b1216;border:1px solid #22303a;border-radius:6px;padding:8px 0;text-align:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
  .N .cn{font-weight:800;font-size:15px;color:#e7f0f4}.N .nx{font-size:11px;color:#5a7280;margin-top:2px}.N .nx b{color:#9ab3bf}
  .N .st{justify-self:start;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .N .st::before{content:'';width:7px;height:7px;border-radius:50%}
  .N .available .st{color:#33d9a6}.N .available .st::before{background:#33d9a6;box-shadow:0 0 6px #33d9a6}.N .limited .st{color:#f0b429}.N .limited .st::before{background:#f0b429;box-shadow:0 0 6px #f0b429}.N .very-limited .st{color:#ff5a4d}.N .very-limited .st::before{background:#ff5a4d;box-shadow:0 0 6px #ff5a4d;animation:rp 1.2s infinite}
  /* seven-seg style LED number */
  .N .disp{display:flex;align-items:center;justify-content:flex-end;gap:2px;background:#080d10;border:1px solid #1c2830;border-radius:7px;padding:7px 10px;box-shadow:inset 0 0 14px rgba(0,0,0,.7)}
  .N .disp .n{font-family:var(--mono);font-size:24px;font-weight:800;line-height:1;letter-spacing:.04em;text-shadow:0 0 10px currentColor}
  .N .available .disp .n{color:#33d9a6}.N .limited .disp .n{color:#f0b429}.N .very-limited .disp .n{color:#ff5a4d}
  .N .disp .u{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#3f5561;margin-left:6px}
  .N .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 15px;border-radius:8px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  /* ===== O — EDITORIAL RANKING ===== */
  .O .board{background:#f7f4ee;border:1px solid #e4ded1;border-radius:18px;padding:8px 24px 20px;color:#211d15;box-shadow:0 40px 80px -40px #000}
  .O .hd{padding:18px 0 12px;border-bottom:2px solid #211d15;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .O .kt{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .O .tick{font-size:11px;font-weight:700;color:#1F6E63;display:flex;align-items:center;gap:6px}.O .dot{width:8px;height:8px;border-radius:50%;background:var(--wa);animation:pl 2s infinite}
  .O .row{display:grid;grid-template-columns:34px 1fr auto auto;gap:18px;align-items:center;padding:15px 0;border-top:1px solid #e0d9cb;color:inherit;text-decoration:none}
  .O .idx{font-family:var(--serif);font-size:20px;color:#b3a98f;font-style:italic}
  .O .cn{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .O .nx{font-size:11.5px;color:#8a7f66;margin-top:2px}
  .O .st{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:3px;margin-left:8px}
  .O .available .st{background:var(--av)}.O .limited .st{background:var(--lim)}.O .very-limited .st{background:var(--vl)}
  .O .num{text-align:right}.O .n{font-family:var(--mono);font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .O .available .n{color:var(--av)}.O .limited .n{color:var(--lim)}.O .very-limited .n{color:var(--vl)}
  .O .nl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#8a7f66;margin-top:2px}
  .O .cta{display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 15px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.6)}

  @media(max-width:560px){
    .N .row{grid-template-columns:48px 1fr auto;grid-template-areas:'code name num' 'code st cta';gap:8px 12px}
    .N .info{grid-area:name}.N .st{grid-area:st}.N .disp{grid-area:num}.N .cta{grid-area:cta;justify-self:end}
    .O .row{grid-template-columns:26px 1fr auto;grid-template-areas:'idx name num' 'idx nx cta';gap:6px 12px}
    .O .idx{grid-area:idx}.O .info{grid-area:name}.O .num{grid-area:num}.O .cta{grid-area:cta;justify-self:end;margin-top:6px}
    .O .cn{font-size:19px}
  }
</style></head><body><div class="wrap">
  <h1>Availability board — premium concepts V</h1>
  <p class="sub">Passport stamps · vault display · editorial ranking</p>
  <div class="tabs">
    <button class="tab on" onclick="sw(0)">M — Passport Stamps</button>
    <button class="tab" onclick="sw(1)">N — Vault Display</button>
    <button class="tab" onclick="sw(2)">O — Editorial Ranking</button>
  </div>
  <div class="panel on M"><div class="book"><div class="bh">Schengen appointment availability — stamped daily</div><div class="grid" id="M"></div></div></div>
  <div class="panel N"><div class="board"><div class="hd"><span class="ttl">SCHENGEN · SLOT VAULT</span><span class="live"><span class="ld"></span>LIVE · 63 OPEN</span></div><div id="N"></div></div></div>
  <div class="panel O"><div class="board"><div class="hd"><span class="kt">Where slots are open</span><span class="tick"><span class="dot"></span>63 open now</span></div><div id="O"></div></div></div>
</div>
<script>
  var WA='<svg class="wa-svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var D=[
    ['France','FR','available',48,'3rd Week Aug 2026'],['Netherlands','NL','limited',2,'3rd Week Aug 2026'],
    ['Iceland','IS','limited',2,'4th Week Aug 2026'],['Hungary','HU','limited',2,'3rd Week Sep 2026'],
    ['Poland','PL','very-limited',4,'Next Week Aug 2026'],['Portugal','PT','very-limited',1,'Next Week Aug 2026'],
    ['Norway','NO','very-limited',1,'3rd Week Aug 2026'],['Switzerland','CH','very-limited',1,'2nd Week Sep 2026'],
    ['Italy','IT','very-limited',1,'3rd Week Sep 2026'],['Liechtenstein','LI','very-limited',1,'2nd Week Sep 2026']
  ];
  var L={available:'Available',limited:'Limited','very-limited':'Very limited'};
  function sl(n){return n==1?'slot':'slots';}
  document.getElementById('M').innerHTML=D.map(function(c){return '<a class="stamp '+c[2]+'" href="#"><div class="arc">◆ Schengen ◆</div><div class="code">'+c[1]+'</div><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div><div class="cn">'+c[0]+'</div><div class="nx">Next: '+c[4]+'</div><span class="st">'+L[c[2]]+'</span><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('N').innerHTML=D.map(function(c){return '<a class="row '+c[2]+'" href="#"><span class="code">'+c[1]+'</span><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><span class="st">'+L[c[2]]+'</span><div class="disp"><span class="n">'+String(c[3]).padStart(2,'0')+'</span><span class="u">'+sl(c[3])+'</span></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('O').innerHTML=D.map(function(c,i){return '<a class="row '+c[2]+'" href="#"><span class="idx">'+(i+1)+'</span><div class="info"><div class="cn">'+c[0]+'<span class="st">'+L[c[2]]+'</span></div><div class="nx">Next: '+c[4]+'</div></div><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+' open</div></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  function sw(i){document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('on',j===i);});document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('on',j===i);});}
</script>
</body></html>
