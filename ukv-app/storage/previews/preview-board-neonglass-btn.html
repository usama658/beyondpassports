<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon-glass Secure button — theme options</title>
<style>
  :root{--ink:#16222E;--edge:#dde3ec;--muted:#5d6b76;--cta:#155E7A;--cta-d:#0F4A61;--stamp:#2E9A8C;--wa:#25D366;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  .open{--c:#1F6E63;--cbg:#e2f1ec}.tight{--c:#b5791f;--cbg:#f7edd6}.none{--c:#c0392b;--cbg:#fbe1dc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#eef2f6;color:var(--ink);padding:26px 16px 90px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:17px;color:#155E7A;font-weight:800;margin-bottom:3px}.sub{font-size:12.5px;color:#5d6b76;margin-bottom:16px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 14px;border:1px solid #cdd8de;background:#fff;border-radius:100px;font:700 12.5px 'Outfit',sans-serif;color:#5d6b76;cursor:pointer}
  .tab.on{background:#155E7A;border-color:#155E7A;color:#fff}
  .desc{font-size:12.5px;color:#42525c;margin:-6px 0 16px;min-height:18px}
  .sec{background:#fff;border:1px solid var(--edge);border-radius:18px;padding:22px}
  .nghd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 2px 14px}
  .ngleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#5d6b76}.ngleg>span{display:inline-flex;align-items:center;gap:6px}
  .nghd .d{width:8px;height:8px;border-radius:50%}.nghd .d.open{background:#1F6E63}.nghd .d.tight{background:#b5791f}.nghd .d.none{background:#c0392b}
  .ngtick{font-size:12px;font-weight:700;color:#1F6E63;display:inline-flex;align-items:center;gap:7px}
  .ngdot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa);animation:pl 2s infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
  .nggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.nggrid{grid-template-columns:1fr}}
  .ngcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:15px;background:#fff;border:1px solid var(--edge);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:0 14px 30px -24px rgba(20,34,46,.5)}
  .ngcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
  .ngn{font-family:var(--mono);font-size:40px;font-weight:900;line-height:1;letter-spacing:-.05em;color:var(--c);flex:none}
  .nginfo{flex:1;min-width:0}
  .ngcn{font-weight:800;font-size:16px}.ngnx{font-size:11.5px;color:#5d6b76;margin-top:1px}.ngnx b{color:#1F6E63}
  .ngstp{display:inline-block;margin-top:6px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px;color:var(--c);background:var(--cbg)}

  /* ── base button shell ── */
  .ngcta{flex:none;display:inline-flex;align-items:center;gap:6px;font:800 11.5px 'Outfit',sans-serif;padding:9px 14px;border-radius:10px;white-space:nowrap;border:1px solid transparent;transition:background .15s,color .15s,box-shadow .15s}
  .ngcta svg{width:14px;height:14px;flex:none}

  /* A · Petrol solid (brand CTA) */
  .A .ngcta{background:var(--cta);color:#fff;box-shadow:0 8px 18px -11px rgba(21,94,122,.75)}
  .A .ngcta svg{fill:#fff}
  .A .ngcard:hover .ngcta{background:var(--cta-d)}
  /* B · Teal stamp */
  .B .ngcta{background:var(--stamp);color:#06231f;box-shadow:0 8px 18px -11px rgba(46,154,140,.7)}
  .B .ngcta svg{fill:#06231f}
  .B .ngcard:hover .ngcta{background:#26887c}
  /* C · Petrol + green WhatsApp glyph chip */
  .C .ngcta{background:var(--cta);color:#fff;box-shadow:0 8px 18px -11px rgba(21,94,122,.75);padding-left:8px}
  .C .ngcta .g{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--wa)}
  .C .ngcta .g svg{width:12px;height:12px;fill:#04140b}
  .C .ngcard:hover .ngcta{background:var(--cta-d)}
  /* D · Petrol outline → fill on hover (quiet) */
  .D .ngcta{background:#fff;color:var(--cta);border-color:#bcd2db}
  .D .ngcta svg{fill:var(--cta)}
  .D .ngcard:hover .ngcta{background:var(--cta);color:#fff;border-color:var(--cta)}
  .D .ngcard:hover .ngcta svg{fill:#fff}
  /* E · Band-matched (button takes each card's status colour) */
  .E .ngcta{background:var(--c);color:#fff;box-shadow:0 8px 18px -12px var(--c)}
  .E .ngcta svg{fill:#fff}
  .E .ngcard:hover .ngcta{filter:brightness(.92)}
  /* F · WhatsApp green refined (current, tidied radius/shadow) */
  .F .ngcta{background:var(--wa);color:#04140b;box-shadow:0 8px 18px -11px rgba(37,211,102,.7)}
  .F .ngcta svg{fill:#04140b}
  .F .ngcard:hover .ngcta{background:#1eb457}
</style></head><body><div class="wrap">
  <h1>Neon-glass board — "Secure" button, theme options</h1>
  <p class="sub">Same board, six button treatments. Site CTA = petrol #155E7A; WhatsApp green #25D366; teal #2E9A8C.</p>
  <div class="tabs">
    <button class="tab on" data-t="A">A · Petrol solid</button>
    <button class="tab" data-t="B">B · Teal stamp</button>
    <button class="tab" data-t="C">C · Petrol + WA chip</button>
    <button class="tab" data-t="D">D · Petrol outline</button>
    <button class="tab" data-t="E">E · Band-matched</button>
    <button class="tab" data-t="F">F · WA green (current)</button>
  </div>
  <p class="desc" id="desc"></p>
  <div class="sec A" id="board">
    <div class="nghd">
      <span class="ngleg"><span><i class="d open"></i>Available</span><span><i class="d tight"></i>Limited</span><span><i class="d none"></i>Very limited</span></span>
      <span class="ngtick"><span class="ngdot"></span>63 slots open now</span>
    </div>
    <div class="nggrid" id="g"></div>
  </div>
</div>
<script>
  var WAP='<path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/>';
  var SVG='<svg viewBox="0 0 24 24">'+WAP+'</svg>';
  var CHIP='<span class="g"><svg viewBox="0 0 24 24">'+WAP+'</svg></span>';
  var D=[['France','open','Available',48,'3rd Week Aug 2026'],['Netherlands','tight','Limited',2,'3rd Week Aug 2026'],['Iceland','tight','Limited',2,'4th Week Aug 2026'],['Hungary','tight','Limited',2,'3rd Week Sep 2026'],['Poland','none','Very limited',4,'Next Week Aug 2026'],['Portugal','none','Very limited',1,'Next Week Aug 2026'],['Switzerland','none','Very limited',1,'2nd Week Sep 2026'],['Italy','none','Very limited',1,'3rd Week Sep 2026']];
  var DESC={A:'Petrol solid — matches the site’s primary CTA button. Strongest brand fit.',B:'Teal (--stamp) — softer, uses the accent/seal colour.',C:'Petrol button with a small green WhatsApp chip — brand colour + keeps the WhatsApp signal.',D:'Petrol outline, fills on hover — quiet, lets the number lead.',E:'Button inherits each card’s status colour (teal/amber/red) — very cohesive with the glow edge.',F:'WhatsApp green, current — tidied radius/shadow.'};
  function cta(t){return t==='C'?CHIP+'Secure':SVG+'Secure';}
  function render(t){
    document.getElementById('g').innerHTML=D.map(function(c){var n=c[3];return '<a class="ngcard '+c[1]+'" href="#"><div class="ngn">'+n+'</div><div class="nginfo"><div class="ngcn">'+c[0]+'</div><div class="ngnx">Next: <b>'+c[4]+'</b></div><span class="ngstp">'+c[2]+' · '+n+' slot'+(n===1?'':'s')+'</span></div><span class="ngcta">'+cta(t)+'</span></a>';}).join('');
    document.getElementById('board').className='sec '+t;
    document.getElementById('desc').textContent=DESC[t];
  }
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');render(b.dataset.t);};});
  render('A');
</script>
</body></html>
