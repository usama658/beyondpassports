     Self-contained CSS + markup. lp-bold token fallbacks baked in. Honest copy. -->
<style>
.rb-stamp{display:inline-block;transform:rotate(-7deg);border:2.5px solid var(--stamp-t,#1F6E63);border-radius:8px;

  mix-blend-mode:multiply;opacity:.92;transition:transform .2s ease;font-family:"Outfit",system-ui,sans-serif}

.rb-stamp::after{content:"";position:absolute;inset:3px;border:1px solid var(--stamp-t,#1F6E63);border-radius:5px;opacity:.5}
.rb-stamp .k{font-weight:800;font-size:9px;letter-spacing:.24em;text-transform:uppercase}
.rb-stamp .v{font-weight:800;font-size:22px;letter-spacing:.04em;margin:1px 0;line-height:1}
.rb-stamp .s{font-weight:700;font-size:8px;letter-spacing:.18em;text-transform:uppercase}

/* DARK variant — place on a dark hero/band. Add class "on-dark". */
.rb-stamp.on-dark{color:var(--on-dark,#79CFC2);border-color:var(--on-dark,#79CFC2);mix-blend-mode:normal;opacity:1}
.rb-stamp.on-dark::after{border-color:var(--on-dark,#79CFC2)}
</style>
