<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointment board — panic rows, BP colours</title>
<style>
  :root{--ink:#16222E;--muted:#5d6b76;--paper:#F4F6FA;--edge:#dde3ec;--stamp:#2E9A8C;--stampd:#1F6E63;--wa:#25D366;
        --av:#1F6E63;--avbg:#e7f4ef;--lim:#b5791f;--limbg:#faeed6;--vl:#c0392b;--vlbg:#fbe4e0;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#0f272e;min-height:100vh;display:grid;place-items:center;padding:26px 16px;color:var(--ink)}
  .board{width:min(720px,100%);background:#fff;border:1px solid var(--edge);border-radius:20px;overflow:hidden;box-shadow:0 50px 100px -40px rgba(0,0,0,.6)}
  /* header — petrol bar like the modal/site */
  .hd{background:linear-gradient(135deg,#16323b,#1F6E63);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8fe3c9}
  .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ticker{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#8fe3c9}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
  .season{font-size:11px;font-weight:700;letter-spacing:.05em;color:#ffd98a;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:4px 10px}
  .legend{display:flex;gap:16px;padding:13px 22px 3px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:8px;height:8px;border-radius:50%}
  .legend .a{background:var(--av)}.legend .l{background:var(--lim)}.legend .v{background:var(--vl)}
  .rows{padding:4px 0 6px}
  .row{display:grid;grid-template-columns:34px 1fr auto 62px auto;align-items:center;gap:16px;padding:13px 22px;border-top:1px solid rgba(0,0,0,.05);border-left:4px solid transparent;cursor:pointer;transition:filter .14s}
  .row:first-child{border-top:none}
  /* each row tinted by its band, like the live cards */
  .row.available{background:var(--avbg)} .row.limited{background:var(--limbg)} .row.very-limited{background:var(--vlbg)}
  .row:hover{filter:brightness(.97)}
  .row.available.sel{border-left-color:var(--av)} .row.limited.sel{border-left-color:var(--lim)} .row.very-limited.sel{border-left-color:var(--vl);filter:brightness(.96)}
  .flag{font-size:22px;line-height:1}
  .cn{font-size:15.5px;font-weight:800;color:var(--ink)}
  .nx{font-size:11.5px;color:var(--muted);margin-top:1px}
  .nx b{color:var(--stampd);font-weight:700}
  .pill{justify-self:start;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:5px;white-space:nowrap}
  .pill.available{background:var(--avbg);color:var(--av)}
  .pill.limited{background:var(--limbg);color:var(--lim)}
  .pill.very-limited{background:var(--vlbg);color:var(--vl)}
  .num{text-align:right}
  .num .n{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .num .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:2px}
  .available .num .n{color:var(--av)} .limited .num .n{color:var(--lim)} .very-limited .num .n{color:var(--vl)}
  .cta{justify-self:end;margin-left:14px;display:inline-flex;align-items:center;gap:6px;background:var(--wa);border:none;color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 15px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.14s;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}
  .cta:hover{background:#1fbd5a;transform:translateY(-1px)}
  .cta svg{width:14px;height:14px;fill:currentColor;flex-shrink:0}
  .ft{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:15px 22px;background:var(--paper);border-top:1px solid var(--edge)}
  .urg{display:flex;align-items:center;gap:10px;min-width:0}
  .upill{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--vl);background:var(--vlbg);border:1px solid rgba(192,57,43,.28);border-radius:6px;padding:4px 9px;white-space:nowrap}
  .umsg{font-size:13px;color:var(--muted)}
  .wa{display:inline-flex;align-items:center;gap:9px;background:var(--wa);color:#04140b;font:800 14.5px 'Outfit',sans-serif;padding:12px 20px;border-radius:11px;border:none;cursor:pointer;box-shadow:0 12px 26px -12px rgba(37,211,102,.6);transition:.15s}
  .wa:hover{background:#1fbd5a;transform:translateY(-1px)}
  .wa svg{width:18px;height:18px;fill:currentColor}
  @media(max-width:560px){
    .row{grid-template-columns:30px 1fr auto;grid-template-areas:'flag name num' 'flag pill cta';gap:6px 12px;padding:14px 16px}
    .flag{grid-area:flag;align-self:start;margin-top:2px}
    .cn-wrap{grid-area:name;min-width:0}.pill{grid-area:pill;align-self:center}.num{grid-area:num}
    .cta{grid-area:cta;justify-self:end;align-self:center;padding:7px 12px}
    .hd,.legend,.ft{padding-left:16px;padding-right:16px}.umsg{font-size:12px}
  }
</style></head><body>
<div class="board">
  <div class="hd">
    <span class="eyebrow">Schengen Appointment Availability</span>
    <div class="right">
      <span class="ticker"><span class="dot"></span>14 slots secured today</span>
      <span class="season">⚡ Summer Peak · Jul–Aug</span>
    </div>
  </div>
  <div class="legend"><span><i class="a"></i>Available</span><span><i class="l"></i>Limited</span><span><i class="v"></i>Very limited</span></div>
  <div class="rows" id="rows"></div>
  <div class="ft">
    <div class="urg"><span class="upill">⏱ Urgent</span><span class="umsg" id="msg">Travelling within 3 weeks? These slots won't wait.</span></div>
    <button class="wa"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>WhatsApp us now</button>
  </div>
</div>
<script>
  var D=[
    ['France','🇫🇷','available',48,'3rd Week Aug 2026'],['Netherlands','🇳🇱','limited',2,'3rd Week Aug 2026'],
    ['Iceland','🇮🇸','limited',2,'4th Week Aug 2026'],['Hungary','🇭🇺','limited',2,'3rd Week Sep 2026'],
    ['Poland','🇵🇱','very-limited',4,'Next Week Aug 2026'],['Portugal','🇵🇹','very-limited',1,'Next Week Aug 2026'],
    ['Norway','🇳🇴','very-limited',1,'3rd Week Aug 2026'],['Switzerland','🇨🇭','very-limited',1,'2nd Week Sep 2026'],
    ['Italy','🇮🇹','very-limited',1,'3rd Week Sep 2026'],['Liechtenstein','🇱🇮','very-limited',1,'2nd Week Sep 2026']
  ];
  var LBL={available:'Available',limited:'Limited','very-limited':'Very limited'};
  var rows=document.getElementById('rows');
  D.forEach(function(c,i){
    var s=c[2],n=c[3];
    var r=document.createElement('div');r.className='row '+s;
    r.innerHTML='<span class="flag">'+c[1]+'</span>'
      +'<div class="cn-wrap"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div>'
      +'<span class="pill '+s+'">'+LBL[s]+'</span>'
      +'<div class="num"><div class="n">'+n+'</div><div class="l">slot'+(n!==1?'s':'')+'</div></div>'
      +'<button class="cta"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>Secure now</button>';
    r.addEventListener('click',function(){
      D.forEach(function(_,j){rows.children[j].className='row '+D[j][2]+(j===i?' sel':'');});
      document.getElementById('msg').textContent=c[0]+': '+n+' slot'+(n!==1?'s':'')+' left. Tap WhatsApp to secure now.';
    });
    rows.appendChild(r);
  });
</script>
</body></html>
