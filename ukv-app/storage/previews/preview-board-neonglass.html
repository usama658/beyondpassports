<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon glass board — variations</title>
<style>
  :root{--wa:#25D366;--mono:ui-monospace,SFMono-Regular,Menlo,'Courier New',monospace;
        --avN:#3fe0a6;--limN:#ffcb52;--vlN:#ff6a5a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#05100f;color:#e7efee;padding:28px 16px 90px}
  .wrap{max-width:800px;margin:0 auto}
  h1{font-size:16px;color:#8fe3c9;font-weight:800;margin-bottom:3px}.sub{font-size:12px;color:#6f8f89;margin-bottom:18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 15px;border:1px solid #1e3a3f;background:transparent;border-radius:100px;font:600 12.5px 'Outfit',sans-serif;color:#7f9b96;cursor:pointer}
  .tab.on{background:#12312e;border-color:#2f9e8f;color:#bff0e2}
  .panel{display:none}.panel.on{display:block}
  .wa-svg{width:14px;height:14px;fill:currentColor;flex:none}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}@keyframes rp{0%,100%{opacity:1}50%{opacity:.5}}
  .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 4px 16px}
  .ey{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7fd7c9}
  .tick{font-size:12px;font-weight:700;color:#7fe0b6;display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa);animation:pl 2s infinite}

  /* shared glass card bits */
  .glass{background:rgba(255,255,255,.055);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:16px;position:relative;overflow:hidden;color:#e7efee;text-decoration:none}
  .glass::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
  .available::before{background:var(--avN);box-shadow:0 0 18px var(--avN)}.limited::before{background:var(--limN);box-shadow:0 0 18px var(--limN)}.very-limited::before{background:var(--vlN);box-shadow:0 0 18px var(--vlN)}
  .code{font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.05em;color:#bfe6dc;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:6px 9px}
  .cn{font-weight:800;font-size:16px}.nx{font-size:11.5px;color:#9fc2ba;margin-top:1px}.nx b{color:#d5ece5}
  .stp{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px}
  .available .stp{background:rgba(63,224,166,.16);color:var(--avN)}.limited .stp{background:rgba(255,203,82,.16);color:var(--limN)}.very-limited .stp{background:rgba(255,106,90,.16);color:var(--vlN)}
  .n{font-family:var(--mono);font-weight:900;line-height:1;letter-spacing:-.05em;text-shadow:0 0 22px currentColor}
  .available .n{color:#8ff0c4}.limited .n{color:#ffdf95}.very-limited .n{color:#ffa196}
  .nl{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:#7ea79d;margin-top:2px}
  .cta{display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 14px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  /* ===== P1 — GLASS ROWS ===== */
  .P1 .stage{background:radial-gradient(90% 80% at 15% 0,#0d3b4d,#071a20 60%),radial-gradient(70% 70% at 100% 100%,#153a2e,transparent);border-radius:20px;padding:18px}
  .P1 .row{display:grid;grid-template-columns:44px 1fr auto 58px auto;gap:16px;align-items:center;padding:14px 16px;margin:9px 0}
  .P1 .row .n{font-size:26px}
  .P1 .stp{justify-self:start}

  /* ===== P2 — BOLD GRID (giant number hero) ===== */
  .P2 .stage{background:radial-gradient(80% 70% at 0 0,#0e3f52,#06181e 55%),radial-gradient(80% 80% at 100% 100%,#17402f,transparent);border-radius:20px;padding:18px}
  .P2 .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:560px){.P2 .grid{grid-template-columns:1fr}}
  .P2 .card{padding:18px 16px 16px}
  .P2 .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .P2 .n{font-size:60px;margin:6px 0 0}
  .P2 .stp{position:absolute;top:16px;right:16px}
  .P2 .cn{margin-top:8px}
  .P2 .cta{margin-top:14px;width:100%;justify-content:center}

  /* ===== P3 — AURORA GLASS (animated bg) ===== */
  .P3 .stage{position:relative;border-radius:20px;overflow:hidden;padding:18px;background:#06161a}
  .P3 .stage::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,#1F6E63,#25d3a0,#0d3b4d,#1a5a3f,#1F6E63);filter:blur(70px);opacity:.5;animation:spin 18s linear infinite;z-index:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .P3 .stage>*{position:relative;z-index:1}
  .P3 .list{display:flex;flex-direction:column;gap:10px}
  .P3 .row{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:15px 16px}
  .P3 .row .n{font-size:34px}
  .P3 .stp{justify-self:start}
  @media(max-width:560px){
    .P1 .row,.P3 .row{grid-template-columns:44px 1fr auto;grid-template-areas:'code name num' 'code st cta';gap:8px 12px}
    .P1 .code,.P3 .code{grid-area:code;align-self:start}.info{grid-area:name}.stp{grid-area:st;align-self:center}.num{grid-area:num}.cta{grid-area:cta;justify-self:end}
    .P3 .row{grid-template-columns:1fr auto}
  }
</style></head><body><div class="wrap">
  <h1>Neon glass board — 3 variations</h1>
  <p class="sub">Frosted glass · neon band glow · glowing numbers · WhatsApp-native</p>
  <div class="tabs">
    <button class="tab on" onclick="sw(0)">P1 — Glass Rows</button>
    <button class="tab" onclick="sw(1)">P2 — Bold Grid</button>
    <button class="tab" onclick="sw(2)">P3 — Aurora Glass</button>
  </div>
  <div class="panel on P1"><div class="stage"><div class="hd"><span class="ey">Schengen Appointment Availability</span><span class="tick"><span class="dot"></span>63 slots open now</span></div><div id="P1"></div></div></div>
  <div class="panel P2"><div class="stage"><div class="hd"><span class="ey">Schengen Appointment Availability</span><span class="tick"><span class="dot"></span>63 slots open now</span></div><div class="grid" id="P2"></div></div></div>
  <div class="panel P3"><div class="stage"><div class="hd"><span class="ey">Live Appointment Availability</span><span class="tick"><span class="dot"></span>63 slots open now</span></div><div class="list" id="P3"></div></div></div>
</div>
<script>
  var WA='<svg class="wa-svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var D=[
    ['France','FR','available',48,'3rd Week Aug 2026'],['Netherlands','NL','limited',2,'3rd Week Aug 2026'],
    ['Iceland','IS','limited',2,'4th Week Aug 2026'],['Hungary','HU','limited',2,'3rd Week Sep 2026'],
    ['Poland','PL','very-limited',4,'Next Week Aug 2026'],['Portugal','PT','very-limited',1,'Next Week Aug 2026'],
    ['Norway','NO','very-limited',1,'3rd Week Aug 2026'],['Switzerland','CH','very-limited',1,'2nd Week Sep 2026'],
    ['Italy','IT','very-limited',1,'3rd Week Sep 2026'],['Liechtenstein','LI','very-limited',1,'2nd Week Sep 2026']
  ];
  var L={available:'Available',limited:'Limited','very-limited':'Very limited'};
  function sl(n){return n==1?'slot':'slots';}
  document.getElementById('P1').innerHTML=D.map(function(c){return '<a class="glass row '+c[2]+'" href="#"><span class="code">'+c[1]+'</span><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><span class="stp">'+L[c[2]]+'</span><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('P2').innerHTML=D.map(function(c){return '<a class="glass card '+c[2]+'" href="#"><span class="stp">'+L[c[2]]+'</span><div class="top"><span class="code">'+c[1]+'</span></div><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+' open</div><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('P3').innerHTML=D.map(function(c){return '<a class="glass row '+c[2]+'" href="#"><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><span class="stp">'+L[c[2]]+'</span><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  function sw(i){document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('on',j===i);});document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('on',j===i);});}
</script>
</body></html>
