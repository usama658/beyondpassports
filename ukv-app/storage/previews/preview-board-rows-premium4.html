<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Availability board — premium concepts IV</title>
<style>
  :root{--wa:#25D366;--mono:ui-monospace,SFMono-Regular,Menlo,'Courier New',monospace;--av:#1F6E63;--lim:#b5791f;--vl:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#050f0d;color:#e7efee;padding:28px 16px 90px}
  .wrap{max-width:780px;margin:0 auto}
  h1{font-size:16px;color:#8fe3c9;font-weight:800;margin-bottom:3px}.sub{font-size:12px;color:#6f8f89;margin-bottom:18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 15px;border:1px solid #1e3a3f;background:transparent;border-radius:100px;font:600 12.5px 'Outfit',sans-serif;color:#7f9b96;cursor:pointer}
  .tab.on{background:#12312e;border-color:#2f9e8f;color:#bff0e2}
  .panel{display:none}.panel.on{display:block}
  .wa-svg{width:14px;height:14px;fill:currentColor;flex:none}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}@keyframes rp{0%,100%{opacity:1}50%{opacity:.5}}

  /* ===== J — HEATMAP TILES ===== */
  .J .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:640px){.J .grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:400px){.J .grid{grid-template-columns:1fr}}
  .J .t{border-radius:16px;padding:16px 15px 14px;color:#fff;text-decoration:none;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:150px;box-shadow:0 20px 44px -28px #000}
  .J .available{background:linear-gradient(150deg,#238a6f,#155248)}.J .limited{background:linear-gradient(150deg,#c08a2c,#8f6413)}.J .very-limited{background:linear-gradient(150deg,#cf3b2c,#8f261c)}
  .J .code{position:absolute;right:-6px;bottom:-18px;font:900 96px var(--mono);color:rgba(255,255,255,.08);letter-spacing:-.04em}
  .J .st{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:6px}
  .J .st::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff}
  .J .very-limited .st::before{animation:rp 1.2s infinite}
  .J .n{font-family:var(--mono);font-size:46px;font-weight:900;line-height:1;letter-spacing:-.05em;margin:8px 0 0}
  .J .nl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
  .J .cn{font-weight:800;font-size:16px;margin-top:6px}
  .J .nx{font-size:11px;opacity:.85;margin-top:1px}
  .J .cta{margin-top:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;font:800 12px 'Outfit',sans-serif;padding:9px;border-radius:9px;backdrop-filter:blur(4px)}

  /* ===== K — MARKET TICKER ===== */
  .K .board{background:#060d12;border:1px solid #0f202b;border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -40px #000}
  .K .tape{display:flex;gap:24px;padding:9px 18px;background:#0a141b;border-bottom:1px solid #0e202b;font-family:var(--mono);font-size:11px;overflow:hidden;white-space:nowrap;color:#4d7d95}
  .K .tape b{color:#00e0a0}.K .tape .dn{color:#ff5a4d}
  .K .row{display:grid;grid-template-columns:48px 1fr 96px 66px auto;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid #0b1a23;color:#c3d4dd;text-decoration:none}
  .K .row:first-of-type{border-top:none}.K .row:hover{background:#0a1620}
  .K .code{font-family:var(--mono);font-weight:800;font-size:13px;color:#e5f0f4;letter-spacing:.05em}
  .K .cn{font-size:13.5px;color:#8fb3c4;margin-top:1px}
  .K .trend{font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
  .K .available .trend{color:#00e0a0}.K .limited .trend{color:#ffc94d}.K .very-limited .trend{color:#ff5a4d}
  .K .num{text-align:right}.K .n{font-family:var(--mono);font-size:24px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .K .available .n{color:#5cf3c6}.K .limited .n{color:#ffd980}.K .very-limited .n{color:#ff8f86}
  .K .nl{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#33566a;margin-top:2px}
  .K .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 14px;border-radius:8px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  /* ===== L — RADIAL GAUGE ===== */
  .L .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(max-width:560px){.L .grid{grid-template-columns:1fr}}
  .L .card{background:linear-gradient(180deg,#0f2429,#0a1a1e);border:1px solid #16302a;border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;color:#dbe7e6;text-decoration:none}
  .L .ring{width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
  .L .ring::before{content:'';position:absolute;inset:8px;border-radius:50%;background:#0b1a17}
  .L .available .ring{background:conic-gradient(#3fb984 var(--p),#123029 0)}
  .L .limited .ring{background:conic-gradient(#e0a52b var(--p),#2a2213 0)}
  .L .very-limited .ring{background:conic-gradient(#ef5b4c var(--p),#2a1412 0)}
  .L .rn{position:relative;font-family:var(--mono);font-size:26px;font-weight:900;line-height:1}
  .L .available .rn{color:#6ee7b7}.L .limited .rn{color:#f2d38a}.L .very-limited .rn{color:#fca5a5}
  .L .info{flex:1;min-width:0}
  .L .cn{font-weight:800;font-size:16px;color:#eaf3f1}
  .L .st{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-top:3px;display:inline-flex;align-items:center;gap:6px}
  .L .st::before{content:'';width:7px;height:7px;border-radius:50%}
  .L .available .st{color:#3fb984}.L .available .st::before{background:#3fb984}.L .limited .st{color:#e0a52b}.L .limited .st::before{background:#e0a52b}.L .very-limited .st{color:#ef5b4c}.L .very-limited .st::before{background:#ef5b4c;box-shadow:0 0 6px #ef5b4c;animation:rp 1.3s infinite}
  .L .nx{font-size:11.5px;color:#587c78;margin-top:6px}.L .nx b{color:#8fb7b1}
  .L .cta{margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:8px 14px;border-radius:9px;white-space:nowrap}

  @media(max-width:560px){
    .K .tape{gap:16px}.K .row{grid-template-columns:48px 1fr auto;grid-template-areas:'code name num' 'code trend cta';gap:8px 12px}
    .K .info{grid-area:name}.K .trend{grid-area:trend}.K .num{grid-area:num}.K .cta{grid-area:cta;justify-self:end}
  }
</style></head><body><div class="wrap">
  <h1>Availability board — premium concepts IV</h1>
  <p class="sub">Heatmap tiles · market ticker · radial gauges</p>
  <div class="tabs">
    <button class="tab on" onclick="sw(0)">J — Heatmap Tiles</button>
    <button class="tab" onclick="sw(1)">K — Market Ticker</button>
    <button class="tab" onclick="sw(2)">L — Radial Gauge</button>
  </div>
  <div class="panel on J"><div class="grid" id="J"></div></div>
  <div class="panel K"><div class="board"><div class="tape" id="Ktape"></div><div id="K"></div></div></div>
  <div class="panel L"><div class="grid" id="L"></div></div>
</div>
<script>
  var WA='<svg class="wa-svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var D=[
    ['France','FR','available',48,'3rd Week Aug 2026'],['Netherlands','NL','limited',2,'3rd Week Aug 2026'],
    ['Iceland','IS','limited',2,'4th Week Aug 2026'],['Hungary','HU','limited',2,'3rd Week Sep 2026'],
    ['Poland','PL','very-limited',4,'Next Week Aug 2026'],['Portugal','PT','very-limited',1,'Next Week Aug 2026'],
    ['Norway','NO','very-limited',1,'3rd Week Aug 2026'],['Switzerland','CH','very-limited',1,'2nd Week Sep 2026'],
    ['Italy','IT','very-limited',1,'3rd Week Sep 2026'],['Liechtenstein','LI','very-limited',1,'2nd Week Sep 2026']
  ];
  var L={available:'Available',limited:'Limited','very-limited':'Very limited'};
  function sl(n){return n==1?'slot':'slots';}
  function deg(n){return Math.max(30,Math.min(360,Math.round(n/12*360)))+'deg';}
  var TR={available:'▲ steady',limited:'▼ tightening','very-limited':'▼ critical'};
  document.getElementById('J').innerHTML=D.map(function(c){return '<a class="t '+c[2]+'" href="#"><span class="code">'+c[1]+'</span><span class="st">'+L[c[2]]+'</span><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+' open</div><div class="cn">'+c[0]+'</div><div class="nx">Next: '+c[4]+'</div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('Ktape').innerHTML=D.map(function(c){return '<span>'+c[1]+' <b class="'+(c[2]==='very-limited'?'dn':'')+'">'+c[3]+'</b></span>';}).join('')+D.slice(0,4).map(function(c){return '<span>'+c[1]+' <b class="'+(c[2]==='very-limited'?'dn':'')+'">'+c[3]+'</b></span>';}).join('');
  document.getElementById('K').innerHTML=D.map(function(c){return '<a class="row '+c[2]+'" href="#"><span class="code">'+c[1]+'</span><div class="info"><div class="cn" style="font-weight:700;color:#e5f0f4;font-size:14px">'+c[0]+'</div><div class="cn">Next: '+c[4]+'</div></div><span class="trend">'+TR[c[2]]+'</span><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div></div><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  document.getElementById('L').innerHTML=D.map(function(c){return '<a class="card '+c[2]+'" href="#"><div class="ring" style="--p:'+deg(c[3])+'"><span class="rn">'+c[3]+'</span></div><div class="info"><div class="cn">'+c[0]+'</div><span class="st">'+L[c[2]]+' · '+sl(c[3])+'</span><div class="nx">Next: <b>'+c[4]+'</b></div><span class="cta">'+WA+'Secure now</span></div></a>';}).join('');
  function sw(i){document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('on',j===i);});document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('on',j===i);});}
</script>
</body></html>
