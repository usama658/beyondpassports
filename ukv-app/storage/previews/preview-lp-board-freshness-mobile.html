<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board freshness bar — mobile</title>
<style>
  :root{--ink:#16222E;--paper:#F4F6FA;--edge:#dde3ec;--cta:#155E7A;--stamp-text:#1F6E63;--muted:#5d6b76;--wa:#25D366}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#0f272e;min-height:100vh;display:grid;place-items:center;padding:22px}
  .phone{width:390px;max-width:100%;background:#0c151a;border:9px solid #223038;border-radius:36px;padding:12px;box-shadow:0 46px 90px -30px #000}
  .scr{border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#EAF1F4,var(--paper) 70%)}
  .sec{padding:20px 15px}
  .btop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp-text)}
  .h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
  .live{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #e11d1d;border-radius:999px;padding:5px 11px;font-weight:800;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#16222E;flex:none}
  .live .d{width:7px;height:7px;border-radius:50%;background:#e11d1d}
  /* freshness bar (mobile stacks) */
  .bfresh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 0}
  .bfresh .fchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--stamp-text);background:rgba(46,154,140,.1);border:1px solid rgba(46,154,140,.28);border-radius:100px;padding:6px 12px}
  .bfresh .fdot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa)}
  .bfresh .fcad{font-size:12px;color:#8a959d}
  .bfresh .fmsg{font-size:12.5px;color:var(--cta);font-weight:700;text-decoration:none}
  /* one board card for context */
  .card{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;background:#f5faf8;border:1px solid var(--edge);border-radius:15px;padding:14px;margin-top:14px;box-shadow:0 14px 30px -24px rgba(20,34,46,.5)}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#1F6E63;box-shadow:0 0 14px #1F6E63}
  .n{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:900;line-height:1;letter-spacing:-.05em;color:#1F6E63}
  .ci{flex:1}.cn{font-weight:800;font-size:16px}.cx{font-size:11.5px;color:#5d6b76;margin-top:1px}.cx b{color:#1F6E63}
  .stp{display:inline-block;margin-top:6px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px;color:#1F6E63;background:#e2f1ec}
</style></head><body>
<div class="phone"><div class="scr"><div class="sec">
  <div class="btop"><div><p class="eyebrow">Schengen Visa Appointment Availability</p><h2 class="h2">Slots vanish in seconds.</h2></div><span class="live"><span class="d"></span>Live</span></div>
  <div class="bfresh">
    <span class="fchip"><span class="fdot"></span>Last checked 16:00 on 9 August</span>
    <span class="fcad">Rechecked every 3 hours</span>
    <a class="fmsg" href="#">Message us for today's numbers →</a>
  </div>
  <div class="card"><div class="n">48</div><div class="ci"><div class="cn">France</div><div class="cx">slots <b>in the next 90 days</b></div><span class="stp">Available · 48 slots</span></div></div>
</div></div></div>
</body></html>
