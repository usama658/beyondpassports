<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Count board — mobile (live)</title>
<style>
  :root{--ink:#16222E;--muted:#5d6b76;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  .open{--c:#1F6E63;--cd:#155248;--cbg:#e7f4ef;--cbg2:#f4fbf8;--cbd:#bfe3d8}
  .tight{--c:#b5791f;--cd:#9a6413;--cbg:#faeed6;--cbg2:#fffaf0;--cbd:#ecce9a}
  .none{--c:#c0392b;--cd:#992a1f;--cbg:#fbe4e0;--cbg2:#fff3f0;--cbd:#eeb4a8}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#0f1a20;min-height:100vh;display:grid;place-items:center;padding:22px}
  .phone{width:390px;max-width:100%;background:#0c151a;border:9px solid #223038;border-radius:36px;padding:14px;box-shadow:0 46px 90px -30px #000}
  .scr{background:linear-gradient(180deg,#14323b,#0f272e);border-radius:26px;padding:16px 13px;max-height:760px;overflow:auto}
  .eyebrow{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#7fd3b9;margin:0 0 4px}
  .h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 12px;color:#fff}
  .legend{display:flex;gap:11px;font-size:10px;color:#9fb3ad;margin:0 0 13px;flex-wrap:wrap}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .hc{border:1.5px solid var(--cbd);border-radius:15px;overflow:hidden;background:#fff;color:var(--ink)}
  .hd{background:linear-gradient(90deg,var(--c),var(--cd));padding:11px 13px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:center;text-align:center;gap:6px}
  .cty{color:#fff;font-size:15px;font-weight:800}
  .pill{flex:0 0 auto;font-weight:800;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--cd);background:#fff;padding:3px 7px;border-radius:999px;white-space:nowrap}
  .bd2{background:var(--cbg);padding:13px;text-align:center}
  .lab{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cd);margin:0 0 5px}
  .count{font-family:var(--mono);font-weight:800;font-size:38px;line-height:.92;color:var(--c)}
  .win{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--cbg2);border:1px solid var(--cbd);border-radius:10px;padding:8px 10px;margin-top:10px}
  .win .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
  .win small{font-size:11px;color:var(--muted);font-weight:600}
</style></head><body>
<div class="phone"><div class="scr">
  <p class="eyebrow">Schengen Visa Appointment Availability</p>
  <h2 class="h2">Slots vanish in seconds.</h2>
  <div class="legend"><span><i style="background:#1F6E63"></i>Available</span><span><i style="background:#b5791f"></i>Limited</span><span><i style="background:#c0392b"></i>Very limited</span></div>
  <div class="grid" id="g"></div>
</div></div>
<script>
  var D=[['Netherlands','tight','LIMITED',2],['France','open','AVAILABLE',48],['Switzerland','none','VERY LIMITED',1],['Liechtenstein','none','VERY LIMITED',1],['Portugal','none','VERY LIMITED',1],['Italy','none','VERY LIMITED',1],['Norway','none','VERY LIMITED',1],['Iceland','tight','LIMITED',2],['Poland','none','VERY LIMITED',4],['Hungary','tight','LIMITED',2]];
  document.getElementById('g').innerHTML=D.map(function(c){
    return '<div class="hc '+c[1]+'"><div class="hd"><span class="cty">'+c[0]+'</span><span class="pill">'+c[2]+'</span></div>'
      +'<div class="bd2"><div class="lab">Slots open</div><div class="count">'+c[3]+'</div>'
      +'<div class="win"><span class="dot"></span><small>In 90 days</small></div></div></div>';
  }).join('');
</script>
</body></html>
