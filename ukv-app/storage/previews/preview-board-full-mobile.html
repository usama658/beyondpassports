<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointment board — full mobile</title>
<style>
  :root{--ink:#16222E;--ink2:#0f2028;--paper:#F4F6FA;--edge:#dde3ec;--cta:#155E7A;--stamp-text:#1F6E63;--muted:#5d6b76;--wa:#25D366;--red:#c0392b;--mono:ui-monospace,Menlo,monospace}
  .open{--c:#1F6E63;--cbg:#e7f4ef;--soft:#f5faf8}.tight{--c:#b5791f;--cbg:#faeed6;--soft:#fdf9ef}.none{--c:#c0392b;--cbg:#fbe4e0;--soft:#fef4f2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#0f272e;min-height:100vh;display:grid;place-items:center;padding:22px}
  .phone{width:390px;max-width:100%;background:#0c151a;border:9px solid #223038;border-radius:36px;padding:12px;box-shadow:0 46px 90px -30px #000}
  .scr{border-radius:26px;overflow:auto;max-height:800px;background:#fff;border-block:1px solid var(--edge)}
  .sec{padding:20px 15px;background:#fff}
  .btop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp-text)}
  .h2{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
  .live{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e11d1d;border-radius:999px;padding:5px 10px;font-weight:800;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;flex:none}
  .live .d{width:7px;height:7px;border-radius:50%;background:#e11d1d}
  .bfresh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 0}
  .fchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--stamp-text);background:rgba(46,154,140,.1);border:1px solid rgba(46,154,140,.28);border-radius:100px;padding:6px 12px}
  .fdot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa)}
  .fcad{font-size:12px;color:#8a959d}.fmsg{font-size:12.5px;color:var(--cta);font-weight:700;text-decoration:none}
  /* neon-glass board */
  .nghd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 0 12px}
  .ngleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#5d6b76}.ngleg span{display:inline-flex;align-items:center;gap:6px}
  .ngleg .d{width:8px;height:8px;border-radius:50%}.d.o{background:#1F6E63}.d.t{background:#b5791f}.d.n{background:#c0392b}
  .ngtick{font-size:12px;font-weight:700;color:#1F6E63;display:inline-flex;align-items:center;gap:7px}.ngdot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa)}
  .ngsearch{position:relative;margin:0 0 12px}
  .ngsearch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:#8a99a2}
  .ngsearch input{width:100%;font:600 14px 'Outfit',sans-serif;padding:12px 14px 12px 38px;border:1px solid var(--edge);border-radius:12px;background:#f7f9fb;outline:none}
  .nggrid{display:grid;grid-template-columns:1fr;gap:11px}
  .ngcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--edge);border-radius:15px;padding:14px;box-shadow:0 14px 30px -24px rgba(20,34,46,.5)}
  .ngcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
  .ngn{font-family:var(--mono);font-size:34px;font-weight:900;line-height:1;letter-spacing:-.05em;color:var(--c);flex:none}
  .nginfo{flex:1;min-width:0}.ngcn{font-weight:800;font-size:16px}.ngnx{font-size:11.5px;color:#5d6b76;margin-top:1px}.ngnx b{color:#1F6E63}
  .ngstp{display:inline-block;margin-top:6px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px;color:var(--c);background:var(--cbg)}
  .ngcta{flex:1 0 100%;justify-content:center;display:inline-flex;align-items:center;gap:6px;background:var(--c);color:#fff;font:800 12.5px 'Outfit',sans-serif;padding:11px;border-radius:10px;margin-top:2px}
  .ngcta svg{width:15px;height:15px;fill:#fff}
  .ngfoot{position:relative;overflow:hidden;display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:13px;padding:14px 15px;border-radius:14px;color:#e6c9c6;background:radial-gradient(400px 150px at 12% 0,rgba(224,52,43,.55),transparent),var(--ink2)}
  .ngup{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:6px;padding:4px 9px}
  .ngmsg{flex:1;min-width:150px;font-size:12.5px}.ngmsg b{color:#fff}
  .ngwa{flex:1 0 100%;justify-content:center;display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--red);font:800 13px 'Outfit',sans-serif;padding:12px;border-radius:11px;text-decoration:none;margin-top:2px}
  .ngwa svg{width:16px;height:16px;fill:var(--red)}
</style></head><body>
<div class="phone"><div class="scr"><div class="sec">
  <div class="btop"><div><p class="eyebrow">Schengen Visa Appointment Availability</p><h2 class="h2">Slots vanish in seconds.</h2></div><span class="live"><span class="d"></span>Live</span></div>
  <div class="bfresh"><span class="fchip"><span class="fdot"></span>Last checked 16:00 on 9 August</span><span class="fcad">Rechecked every 3 hours</span><a class="fmsg" href="#">Message us for today's numbers →</a></div>
  <div class="nghd"><span class="ngleg"><span><i class="d o"></i>Available</span><span><i class="d t"></i>Limited</span><span><i class="d n"></i>Very limited</span></span><span class="ngtick"><span class="ngdot"></span>62 slots open now</span></div>
  <div class="ngsearch"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg><input placeholder="Search a Schengen country…"></div>
  <div class="nggrid" id="g"></div>
  <div class="ngfoot"><span class="ngup">⏱ Urgent</span><span class="ngmsg">Travelling within 3 weeks? <b>These slots won't wait.</b></span><a class="ngwa" href="#"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>Message us now</a></div>
</div></div></div>
<script>
  var WA='<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var D=[['France','open','Available',48],['Netherlands','tight','Limited',2],['Switzerland','none','Very limited',1],['Poland','none','Very limited',4]];
  document.getElementById('g').innerHTML=D.map(function(c){var n=c[3];return '<a class="ngcard '+c[1]+'" href="#"><div class="ngn">'+n+'</div><div class="nginfo"><div class="ngcn">'+c[0]+'</div><div class="ngnx">slot'+(n===1?'':'s')+' <b>in the next 90 days</b></div><span class="ngstp">'+c[2]+' · '+n+' slot'+(n===1?'':'s')+'</span></div><span class="ngcta">'+WA+'Secure</span></a>';}).join('');
</script>
</body></html>
