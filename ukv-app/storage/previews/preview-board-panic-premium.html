<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointment board — premium panic-board</title>
<style>
  :root{--wa:#25D366;--av:#3fb984;--avd:#2f9e5f;--lim:#e0a52b;--vl:#ef5b4c;--line:#12262b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#0a1418;min-height:100vh;display:grid;place-items:center;padding:26px 16px;color:#dbe7e6}
  .board{width:min(720px,100%);background:linear-gradient(180deg,#0f2429,#0a1a1e);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 50px 100px -40px #000}
  /* header */
  .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 22px 0}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#5f8f89}
  .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ticker{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--av)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--av);box-shadow:0 0 8px var(--av);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
  .season{font-size:11px;font-weight:700;letter-spacing:.06em;color:#e0a52b;background:rgba(224,165,43,.1);border:1px solid rgba(224,165,43,.28);border-radius:6px;padding:4px 10px}
  .legend{display:flex;gap:16px;padding:14px 22px 4px;font-size:11px;color:#5f8f89;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:8px;height:8px;border-radius:50%}
  .rows{padding:6px 0}
  /* row */
  .row{display:grid;grid-template-columns:34px 1fr auto 74px 108px;align-items:center;gap:14px;padding:13px 22px;border-top:1px solid #0c1c20;cursor:pointer;transition:background .15s}
  .row:hover{background:#0e2429}
  .row.sel{background:#102b31}
  .flag{font-size:22px;line-height:1}
  .cn{font-size:15.5px;font-weight:700;color:#eaf3f1}
  .nx{font-size:11.5px;color:#587c78;margin-top:1px}
  .nx b{color:#8fb7b1;font-weight:700}
  .pill{justify-self:start;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:5px;white-space:nowrap}
  .pill.available{background:rgba(63,185,132,.12);color:var(--av)}
  .pill.limited{background:rgba(224,165,43,.13);color:var(--lim)}
  .pill.very-limited{background:rgba(239,91,76,.12);color:var(--vl)}
  .num{text-align:right}
  .num .n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .num .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#3f625e;margin-top:2px}
  .available .num .n{color:var(--av)} .limited .num .n{color:var(--lim)}
  .very-limited .num .n{color:var(--vl);animation:rp 1.5s ease-in-out infinite}
  @keyframes rp{0%,100%{opacity:1}50%{opacity:.55}}
  .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid #17343a;color:#79a49e;font:700 12px 'Outfit',sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s}
  .cta:hover{border-color:var(--wa);color:#fff;background:rgba(37,211,102,.1)}
  .row.very-limited .cta{border-color:rgba(239,91,76,.3);color:var(--vl)}
  .row.very-limited .cta:hover{background:rgba(239,91,76,.12);color:#fff;border-color:var(--vl)}
  /* footer */
  .ft{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 22px;background:#081418;border-top:1px solid var(--line)}
  .urg{display:flex;align-items:center;gap:10px;min-width:0}
  .upill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--vl);background:rgba(239,91,76,.12);border:1px solid rgba(239,91,76,.28);border-radius:6px;padding:4px 9px;white-space:nowrap}
  .umsg{font-size:13px;color:#6e928d}
  .wa{display:inline-flex;align-items:center;gap:9px;background:var(--wa);color:#04140b;font:800 14.5px 'Outfit',sans-serif;padding:12px 20px;border-radius:11px;border:none;cursor:pointer;box-shadow:0 12px 26px -12px rgba(37,211,102,.6);transition:.15s}
  .wa:hover{background:#1fbd5a;transform:translateY(-1px)}
  .wa svg{width:18px;height:18px;fill:currentColor}
  /* mobile */
  @media(max-width:560px){
    .row{grid-template-columns:30px 1fr auto;grid-template-areas:'flag name num' 'flag pill cta';gap:8px 12px;padding:14px 16px}
    .flag{grid-area:flag;align-self:start;margin-top:2px}
    .row .cn-wrap{grid-area:name;min-width:0}
    .pill{grid-area:pill;align-self:center}
    .num{grid-area:num}
    .cta{grid-area:cta;justify-self:end;align-self:center}
    .hd{padding:16px 16px 0}.legend{padding:12px 16px 4px}
    .umsg{font-size:12px}
  }
</style></head><body>
<div class="board">
  <div class="hd">
    <span class="eyebrow">Schengen Appointment Availability</span>
    <div class="right">
      <span class="ticker"><span class="dot"></span>14 slots secured today</span>
      <span class="season">⚡ Summer Peak · Jul–Aug</span>
    </div>
  </div>
  <div class="legend"><span><i style="background:var(--av)"></i>Available</span><span><i style="background:var(--lim)"></i>Limited</span><span><i style="background:var(--vl)"></i>Very limited</span></div>
  <div class="rows" id="rows"></div>
  <div class="ft">
    <div class="urg"><span class="upill">⏱ Urgent</span><span class="umsg" id="msg">Travelling within 3 weeks? These slots won't wait.</span></div>
    <button class="wa"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>WhatsApp us now</button>
  </div>
</div>
<script>
  var D=[
    ['France','🇫🇷','available',48,'3rd Week Aug 2026'],
    ['Netherlands','🇳🇱','limited',2,'3rd Week Aug 2026'],
    ['Iceland','🇮🇸','limited',2,'4th Week Aug 2026'],
    ['Hungary','🇭🇺','limited',2,'3rd Week Sep 2026'],
    ['Poland','🇵🇱','very-limited',4,'Next Week Aug 2026'],
    ['Portugal','🇵🇹','very-limited',1,'Next Week Aug 2026'],
    ['Norway','🇳🇴','very-limited',1,'3rd Week Aug 2026'],
    ['Switzerland','🇨🇭','very-limited',1,'2nd Week Sep 2026'],
    ['Italy','🇮🇹','very-limited',1,'3rd Week Sep 2026'],
    ['Liechtenstein','🇱🇮','very-limited',1,'2nd Week Sep 2026']
  ];
  var LBL={available:'Available',limited:'Limited','very-limited':'Very limited'};
  var rows=document.getElementById('rows');
  D.forEach(function(c,i){
    var s=c[2],n=c[3];
    var r=document.createElement('div');r.className='row '+s;
    r.innerHTML='<span class="flag">'+c[1]+'</span>'
      +'<div class="cn-wrap"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div>'
      +'<span class="pill '+s+'">'+LBL[s]+'</span>'
      +'<div class="num"><div class="n">'+n+'</div><div class="l">slot'+(n!==1?'s':'')+'</div></div>'
      +'<button class="cta">Secure →</button>';
    r.addEventListener('click',function(){
      D.forEach(function(_,j){rows.children[j].classList.toggle('sel',j===i);});
      document.getElementById('msg').textContent=c[0]+': '+n+' slot'+(n!==1?'s':'')+' left. Tap WhatsApp to secure now.';
    });
    rows.appendChild(r);
  });
</script>
</body></html>
