<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Availability board — premium concepts VI</title>
<style>
  :root{--wa:#25D366;--mono:ui-monospace,SFMono-Regular,Menlo,'Courier New',monospace;--av:#1F6E63;--lim:#b5791f;--vl:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#070f12;color:#e7efee;padding:28px 16px 90px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:16px;color:#8fe3c9;font-weight:800;margin-bottom:3px}.sub{font-size:12px;color:#6f8f89;margin-bottom:18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 15px;border:1px solid #1e3a3f;background:transparent;border-radius:100px;font:600 12.5px 'Outfit',sans-serif;color:#7f9b96;cursor:pointer}
  .tab.on{background:#12312e;border-color:#2f9e8f;color:#bff0e2}
  .panel{display:none}.panel.on{display:block}
  .wa-svg{width:14px;height:14px;fill:currentColor;flex:none}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}@keyframes rp{0%,100%{opacity:1}50%{opacity:.5}}

  /* ===== P — NEON GLASS ===== */
  .P .stage{background:radial-gradient(90% 80% at 20% 0,#0d3b4d,#081820 60%),radial-gradient(70% 60% at 100% 100%,#1a3a2f,transparent);border-radius:20px;padding:20px}
  .P .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 6px 16px}
  .P .ey{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7fd7c9}
  .P .tick{font-size:12px;font-weight:700;color:#7fe0b6;display:flex;align-items:center;gap:7px}.P .dot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa);animation:pl 2s infinite}
  .P .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:560px){.P .grid{grid-template-columns:1fr}}
  .P .card{background:rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;color:#e7efee;text-decoration:none;position:relative;overflow:hidden}
  .P .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
  .P .available::before{background:#3fe0a6;box-shadow:0 0 16px #3fe0a6}.P .limited::before{background:#ffcb52;box-shadow:0 0 16px #ffcb52}.P .very-limited::before{background:#ff6a5a;box-shadow:0 0 16px #ff6a5a}
  .P .n{font-family:var(--mono);font-size:40px;font-weight:900;line-height:1;letter-spacing:-.05em;flex:none;text-shadow:0 0 22px currentColor}
  .P .available .n{color:#7fe0b6}.P .limited .n{color:#ffd980}.P .very-limited .n{color:#ff9182}
  .P .info{flex:1;min-width:0}
  .P .cn{font-weight:800;font-size:16px}.P .nx{font-size:11.5px;color:#9fc2ba;margin-top:1px}.P .nx b{color:#d5ece5}
  .P .st{display:inline-block;margin-top:6px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px}
  .P .available .st{background:rgba(63,224,166,.16);color:#7fe0b6}.P .limited .st{background:rgba(255,203,82,.16);color:#ffd980}.P .very-limited .st{background:rgba(255,106,90,.16);color:#ff9182}
  .P .cta{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 11.5px 'Outfit',sans-serif;padding:9px 13px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  /* ===== Q — GROUPED BY URGENCY ===== */
  .Q .board{background:#fff;border:1px solid #dde3ec;border-radius:18px;overflow:hidden;color:#16222E;box-shadow:0 40px 80px -40px #000}
  .Q .gh{display:flex;align-items:center;gap:9px;padding:12px 20px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .Q .gh.vl{background:#fbe4e0;color:#c0392b}.Q .gh.lim{background:#faeed6;color:#b5791f}.Q .gh.av{background:#e7f4ef;color:#1F6E63}
  .Q .gh .c{margin-left:auto;font-family:var(--mono);opacity:.7}
  .Q .row{display:grid;grid-template-columns:40px 1fr auto 52px auto;gap:16px;align-items:center;padding:13px 20px;border-top:1px solid #f0f2f5;color:#16222E;text-decoration:none}
  .Q .code{font-family:var(--mono);font-weight:800;font-size:12px;color:#5d6b76;background:#f2f5f8;border:1px solid #e3e8ee;border-radius:7px;padding:7px 0;text-align:center}
  .Q .cn{font-weight:800;font-size:15px}.Q .nx{font-size:11.5px;color:#5d6b76;margin-top:1px}.Q .nx b{color:#1F6E63}
  .Q .num{text-align:right}.Q .n{font-family:var(--mono);font-size:24px;font-weight:800;line-height:1}
  .Q .vlc .n{color:#c0392b}.Q .limc .n{color:#b5791f}.Q .avc .n{color:#1F6E63}
  .Q .nl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#5d6b76;margin-top:2px}
  .Q .cta{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 14px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}

  /* ===== R — CINEMATIC BIG-BOARD ===== */
  .R .board{background:#05100e;border:1px solid #14322b;border-radius:18px;overflow:hidden;box-shadow:0 40px 90px -40px #000}
  .R .banner{padding:22px 24px;background:linear-gradient(120deg,#0e2c25,#081b17);border-bottom:1px solid #14322b;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .R .bt{font-size:26px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.05}
  .R .bs{font-size:12.5px;color:#6fa398;margin-top:6px}
  .R .bstat{text-align:right}.R .bstat .bn{font-family:var(--mono);font-size:40px;font-weight:900;color:#7fe0b6;line-height:1;letter-spacing:-.04em}.R .bstat .bl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#4d7d6f}
  .R .row{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;padding:16px 24px;border-top:1px solid #0c211c;color:#cfe0dc;text-decoration:none}
  .R .row:hover{background:#0a1b17}
  .R .l{display:flex;align-items:baseline;gap:12px;min-width:0}
  .R .cn{font-size:20px;font-weight:800;letter-spacing:-.01em;color:#eef7f4}
  .R .nx{font-size:11.5px;color:#4d6d67}.R .nx b{color:#8fb7b1}
  .R .st{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .R .st::before{content:'';width:8px;height:8px;border-radius:50%}
  .R .available .st{color:#3fe0a6}.R .available .st::before{background:#3fe0a6;box-shadow:0 0 7px #3fe0a6}.R .limited .st{color:#ffcb52}.R .limited .st::before{background:#ffcb52}.R .very-limited .st{color:#ff6a5a}.R .very-limited .st::before{background:#ff6a5a;box-shadow:0 0 7px #ff6a5a;animation:rp 1.2s infinite}
  .R .n{font-family:var(--mono);font-size:34px;font-weight:900;line-height:1;letter-spacing:-.04em;min-width:56px;text-align:right}
  .R .available .n{color:#7fe0b6}.R .limited .n{color:#ffd980}.R .very-limited .n{color:#ff9182}
  .R .cta{display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#04140b;font:800 12px 'Outfit',sans-serif;padding:9px 15px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(37,211,102,.7)}
  @media(max-width:560px){
    .R .row{grid-template-columns:1fr auto;grid-template-areas:'l n' 'st cta';gap:8px 12px}.R .l{grid-area:l}.R .n{grid-area:n}.R .st{grid-area:st;align-self:center}.R .cta{grid-area:cta;justify-self:end}
    .R .bt{font-size:21px}.R .cn{font-size:17px}
  }
</style></head><body><div class="wrap">
  <h1>Availability board — premium concepts VI</h1>
  <p class="sub">Neon glass · urgency-grouped · cinematic big-board</p>
  <div class="tabs">
    <button class="tab on" onclick="sw(0)">P — Neon Glass</button>
    <button class="tab" onclick="sw(1)">Q — Grouped by Urgency</button>
    <button class="tab" onclick="sw(2)">R — Cinematic Board</button>
  </div>
  <div class="panel on P"><div class="stage"><div class="hd"><span class="ey">Schengen Appointment Availability</span><span class="tick"><span class="dot"></span>63 slots open now</span></div><div class="grid" id="P"></div></div></div>
  <div class="panel Q"><div class="board" id="Q"></div></div>
  <div class="panel R"><div class="board">
    <div class="banner"><div><div class="bt">Slots vanish in seconds.</div><div class="bs">10 Schengen countries · confirmed live · we reply in 30 min</div></div><div class="bstat"><div class="bn">63</div><div class="bl">slots open now</div></div></div>
    <div id="R"></div>
  </div></div>
</div>
<script>
  var WA='<svg class="wa-svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var D=[
    ['France','FR','available',48,'3rd Week Aug 2026'],['Netherlands','NL','limited',2,'3rd Week Aug 2026'],
    ['Iceland','IS','limited',2,'4th Week Aug 2026'],['Hungary','HU','limited',2,'3rd Week Sep 2026'],
    ['Poland','PL','very-limited',4,'Next Week Aug 2026'],['Portugal','PT','very-limited',1,'Next Week Aug 2026'],
    ['Norway','NO','very-limited',1,'3rd Week Aug 2026'],['Switzerland','CH','very-limited',1,'2nd Week Sep 2026'],
    ['Italy','IT','very-limited',1,'3rd Week Sep 2026'],['Liechtenstein','LI','very-limited',1,'2nd Week Sep 2026']
  ];
  var L={available:'Available',limited:'Limited','very-limited':'Very limited'};
  function sl(n){return n==1?'slot':'slots';}
  document.getElementById('P').innerHTML=D.map(function(c){return '<a class="card '+c[2]+'" href="#"><div class="n">'+c[3]+'</div><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div><span class="st">'+L[c[2]]+' · '+sl(c[3])+'</span></div><span class="cta">'+WA+'Secure</span></a>';}).join('');
  // Q grouped
  function qrow(c,cls){return '<a class="row '+cls+'" href="#"><span class="code">'+c[1]+'</span><div class="info"><div class="cn">'+c[0]+'</div><div class="nx">Next: <b>'+c[4]+'</b></div></div><span></span><div class="num"><div class="n">'+c[3]+'</div><div class="nl">'+sl(c[3])+'</div></div><span class="cta">'+WA+'Secure now</span></a>';}
  var vl=D.filter(function(c){return c[2]==='very-limited';}),lim=D.filter(function(c){return c[2]==='limited';}),av=D.filter(function(c){return c[2]==='available';});
  document.getElementById('Q').innerHTML=
    '<div class="gh vl">🔥 Closing fast — very limited<span class="c">'+vl.length+'</span></div>'+vl.map(function(c){return qrow(c,'vlc');}).join('')
   +'<div class="gh lim">⏳ Limited — moving quickly<span class="c">'+lim.length+'</span></div>'+lim.map(function(c){return qrow(c,'limc');}).join('')
   +'<div class="gh av">✓ Good availability<span class="c">'+av.length+'</span></div>'+av.map(function(c){return qrow(c,'avc');}).join('');
  document.getElementById('R').innerHTML=D.map(function(c){return '<a class="row '+c[2]+'" href="#"><div class="l"><span class="cn">'+c[0]+'</span><span class="nx">Next: <b>'+c[4]+'</b></span></div><span class="n">'+c[3]+'</span><span class="st">'+L[c[2]]+'</span><span class="cta">'+WA+'Secure now</span></a>';}).join('');
  function sw(i){document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('on',j===i);});document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('on',j===i);});}
</script>
</body></html>
