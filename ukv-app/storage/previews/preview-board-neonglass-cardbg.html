<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon-glass cards — band-tinted backgrounds</title>
<style>
  :root{--edge:#dde3ec;--muted:#5d6b76;--wa:#25D366;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  .open{--c:#1F6E63;--cbg:#e2f1ec;--soft:#eef7f3;--tintA:#e6f3ee;--tintB:#f5faf8}
  .tight{--c:#b5791f;--cbg:#f7edd6;--soft:#fbf4e4;--tintA:#f9f0dd;--tintB:#fdf9ef}
  .none{--c:#c0392b;--cbg:#fbe1dc;--soft:#fdeeeb;--tintA:#fbe7e3;--tintB:#fef4f2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;color:#16222E;background:#eef2f6;padding:26px 16px 90px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:17px;color:#155E7A;font-weight:800;margin-bottom:3px}.sub{font-size:12.5px;color:#5d6b76;margin-bottom:14px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:8px 14px;border:1px solid #cdd8de;background:#fff;border-radius:100px;font:700 12.5px 'Outfit',sans-serif;color:#5d6b76;cursor:pointer}
  .tab.on{background:#155E7A;border-color:#155E7A;color:#fff}
  .desc{font-size:12.5px;color:#42525c;margin:0 0 14px;min-height:18px}
  .sec{background:#fff;border:1px solid var(--edge);border-radius:18px;padding:20px}
  .nghd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 2px 14px}
  .ngleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#5d6b76}.ngleg>span{display:inline-flex;align-items:center;gap:6px}
  .nghd .d{width:8px;height:8px;border-radius:50%}.nghd .d.open{background:#1F6E63}.nghd .d.tight{background:#b5791f}.nghd .d.none{background:#c0392b}
  .ngtick{font-size:12px;font-weight:700;color:#1F6E63;display:inline-flex;align-items:center;gap:7px}
  .ngdot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa)}
  .nggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.nggrid{grid-template-columns:1fr}}
  .ngcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:15px;border:1px solid var(--edge);border-radius:16px;padding:16px;text-decoration:none;color:#16222E;box-shadow:0 14px 30px -24px rgba(20,34,46,.5);background:#fff}
  .ngcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
  .ngn{font-family:var(--mono);font-size:40px;font-weight:900;line-height:1;letter-spacing:-.05em;color:var(--c);flex:none}
  .nginfo{flex:1;min-width:0}.ngcn{font-weight:800;font-size:16px}.ngnx{font-size:11.5px;color:#5d6b76;margin-top:1px}.ngnx b{color:#1F6E63}
  .ngstp{display:inline-block;margin-top:6px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px;color:var(--c);background:var(--cbg)}
  .ngcta{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--c);color:#fff;font:800 11.5px 'Outfit',sans-serif;padding:9px 13px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 18px -12px var(--c)}
  .ngcta svg{width:14px;height:14px;fill:#fff;flex:none}

  /* tint modes toggle via body class */
  body.t1 .ngcard{background:var(--cbg)}
  body.t2 .ngcard{background:var(--soft)}
  body.t3 .ngcard{background:linear-gradient(100deg,var(--tintA),#fff 78%)}
  body.t4 .ngcard{background:var(--tintB)}
  body.t3 .ngstp,body.t1 .ngstp{background:rgba(255,255,255,.6)}
</style></head><body class="t2"><div class="wrap">
  <h1>Neon-glass cards — band-tinted backgrounds</h1>
  <p class="sub">Card body picks up its status colour. Toggle intensity.</p>
  <div class="tabs">
    <button class="tab" data-t="t0">T0 · White (current)</button>
    <button class="tab on" data-t="t2">T2 · Soft tint</button>
    <button class="tab" data-t="t4">T4 · Faint tint</button>
    <button class="tab" data-t="t1">T1 · Full tint</button>
    <button class="tab" data-t="t3">T3 · Gradient from edge</button>
  </div>
  <p class="desc" id="desc"></p>
  <div class="sec">
    <div class="nghd"><span class="ngleg"><span><i class="d open"></i>Available</span><span><i class="d tight"></i>Limited</span><span><i class="d none"></i>Very limited</span></span><span class="ngtick"><span class="ngdot"></span>63 slots open now</span></div>
    <div class="nggrid" id="g"></div>
  </div>
</div>
<script>
  var WA='<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var D=[['France','open','Available',48,'3rd Week Aug 2026'],['Netherlands','tight','Limited',2,'3rd Week Aug 2026'],['Iceland','tight','Limited',2,'4th Week Aug 2026'],['Hungary','tight','Limited',2,'3rd Week Sep 2026'],['Poland','none','Very limited',4,'Next Week Aug 2026'],['Portugal','none','Very limited',1,'Next Week Aug 2026'],['Switzerland','none','Very limited',1,'2nd Week Sep 2026'],['Italy','none','Very limited',1,'3rd Week Sep 2026']];
  var DESC={t0:'White cards (current) — colour only on the glow edge, number and chip.',t2:'Soft tint — a gentle wash of the status colour. Readable, premium. My pick.',t4:'Faint tint — barely-there colour, mostly white.',t1:'Full tint — the status colour at chip strength. Boldest.',t3:'Gradient — colour bleeds from the glow edge and fades to white.'};
  document.getElementById('g').innerHTML=D.map(function(c){var n=c[3];return '<a class="ngcard '+c[1]+'" href="#"><div class="ngn">'+n+'</div><div class="nginfo"><div class="ngcn">'+c[0]+'</div><div class="ngnx">Next: <b>'+c[4]+'</b></div><span class="ngstp">'+c[2]+' · '+n+' slot'+(n===1?'':'s')+'</span></div><span class="ngcta">'+WA+'Secure</span></a>';}).join('');
  function set(t){document.body.className=t==='t0'?'':t;document.getElementById('desc').textContent=DESC[t];}
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');set(b.dataset.t);};});
  set('t2');
</script>
</body></html>
