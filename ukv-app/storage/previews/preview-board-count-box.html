<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Count card — boxed "in next 90 days"</title>
<style>
  :root{--ink:#16222E;--muted:#5d6b76;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  .open{--c:#1F6E63;--cd:#155248;--cbg:#e7f4ef;--cbg2:#f4fbf8;--cbd:#bfe3d8}
  .tight{--c:#b5791f;--cd:#9a6413;--cbg:#faeed6;--cbg2:#fffaf0;--cbd:#ecce9a}
  .none{--c:#c0392b;--cd:#992a1f;--cbg:#fbe4e0;--cbg2:#fff3f0;--cbd:#eeb4a8}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Outfit',system-ui,'Segoe UI',sans-serif;background:#0f1a20;color:#fff;padding:28px 18px}
  h2{font-size:15px;color:#8fe3c9;text-align:center;margin:0 0 4px}
  p.s{font-size:12px;color:#9fb3ad;text-align:center;margin:0 0 22px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1000px;margin:0 auto}
  @media(max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr 1fr}}
  .hc{border:1.5px solid var(--cbd);border-radius:16px;overflow:hidden;box-shadow:0 20px 44px -30px rgba(0,0,0,.6);background:#fff;color:var(--ink)}
  .hd{background:linear-gradient(90deg,var(--c),var(--cd));padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cty{color:#fff;font-size:18px;font-weight:800}
  .pill{flex:0 0 auto;font-weight:800;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--cd);background:#fff;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .bd2{background:var(--cbg);padding:16px 18px;text-align:center}
  .lab{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cd);margin:0 0 6px}
  .count{font-family:var(--mono);font-weight:800;font-size:44px;line-height:.92;color:var(--c)}
  /* boxed "in next 90 days" — full-width rectangular box, same tokens as the old slots box */
  .win{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--cbg2);border:1px solid var(--cbd);border-radius:10px;padding:9px 12px;margin-top:12px}
  .win .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .win small{font-size:12px;color:var(--muted);font-weight:600}
</style></head><body>
  <h2>Count card — "in next 90 days" boxed</h2>
  <p class="s">Rectangular boxed background (the old slots-box), not the rounded pill.</p>
  <div class="grid" id="g"></div>
<script>
  var D=[['Netherlands','tight','LIMITED',2],['France','open','AVAILABLE',48],['Switzerland','none','VERY LIMITED',1],['Iceland','tight','LIMITED',2]];
  document.getElementById('g').innerHTML=D.map(function(c){
    return '<div class="hc '+c[1]+'"><div class="hd"><span class="cty">'+c[0]+'</span><span class="pill">'+c[2]+'</span></div>'
      +'<div class="bd2"><div class="lab">Slots open</div><div class="count">'+c[3]+'</div>'
      +'<div class="win"><span class="dot"></span><small>in next 90 days</small></div></div></div>';
  }).join('');
</script>
</body></html>
