<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eligibility — premium polish</title>
<style>
  :root{--ink:#16222E;--ink2:#0f2028;--paper:#F4F6FA;--edge:#dde3ec;--cta:#155E7A;--cta-d:#0F4A61;--stamp:#2E9A8C;--stamp-t:#1F6E63;--muted:#5d6b76;--wa:#25D366;--red:#c0492f;--gold:#C89B3C}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,'Segoe UI',sans-serif;color:var(--ink);background:#e7edf2;padding:24px 14px 90px}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:17px;color:#155E7A;font-weight:800;margin-bottom:2px}.subx{font-size:12.5px;color:#5d6b76;margin-bottom:16px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 15px;border:1px solid #cdd8de;background:#fff;border-radius:100px;font:700 12.5px 'Outfit',sans-serif;color:#5d6b76;cursor:pointer}
  .tab.on{background:#155E7A;border-color:#155E7A;color:#fff}
  .panel{display:none}.panel.on{display:block}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .eyebrow::before{content:"";width:24px;height:2px}
  .wa-svg{width:18px;height:18px;fill:#fff}
  .btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--wa);color:#fff;font:800 15px 'Outfit',sans-serif;padding:14px 22px;border-radius:12px;text-decoration:none;box-shadow:0 16px 34px -16px rgba(37,211,102,.7)}
  .also b{color:var(--ink)}

  /* shared two-tone shell */
  .shell{display:grid;grid-template-columns:1fr 1.15fr;border:1px solid var(--edge);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 40px 90px -60px rgba(20,34,46,.7)}
  @media(max-width:820px){.shell{grid-template-columns:1fr}}
  .L{position:relative;padding:40px 34px;color:#dbe8ea;display:flex;flex-direction:column;overflow:hidden}
  .L .eyebrow{color:#7fd7c9}.L .eyebrow::before{background:#7fd7c9}
  .L h2{color:#fff;font-size:clamp(25px,2.8vw,33px);line-height:1.12;letter-spacing:-.02em;margin:14px 0 12px;max-width:20ch}
  .L .hl{color:#ffb4a6}
  .L .intro{color:#a9c2bd;font-size:15.5px;line-height:1.62;margin:0 0 22px;max-width:40ch}
  .L .actions{margin-top:auto}
  .L .sub{color:#7f9b96;font-size:12px;line-height:1.5;margin:12px 0 0;max-width:38ch}
  .R{padding:30px 32px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:540px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--edge);border-radius:14px;padding:16px 17px;transition:transform .16s ease,box-shadow .16s ease,border-color .15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 22px 44px -30px rgba(20,34,46,.5);border-color:#cfe0da}
  .card h3{font-size:14.5px;font-weight:800;margin:0 0 5px;display:flex;align-items:center;gap:9px}
  .card p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0}
  .chip{flex:none;width:30px;height:26px;border-radius:7px;background:rgba(46,154,140,.12);color:var(--stamp-t);display:grid;place-items:center;font-weight:900;font-size:10px;letter-spacing:.02em}
  .also{color:var(--muted);font-size:13px;line-height:1.6;margin:16px 0 0}
  .freepill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8ff0c4;background:rgba(63,224,166,.14);border:1px solid rgba(63,224,166,.3);border-radius:100px;padding:5px 11px;margin-bottom:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:#25D366;box-shadow:0 0 8px #25D366}

  /* P1 · petrol glow + left-rule cards */
  .p1 .L{background:radial-gradient(560px 340px at 16% -5%,rgba(46,154,140,.4),transparent),var(--ink2)}
  .p1 .card{border-left:3px solid var(--stamp)}
  .p1 .chip{display:none}

  /* P2 · monogram chip cards + top accent */
  .p2 .L{background:radial-gradient(560px 340px at 84% 0,rgba(21,94,122,.55),transparent),var(--ink2)}
  .p2 .card{border-top:2px solid transparent}
  .p2 .card:hover{border-top-color:var(--stamp)}

  /* P3 · deep petrol gradient (brand), glass cards on paper-tint right */
  .p3 .L{background:linear-gradient(160deg,var(--cta),var(--cta-d))}
  .p3 .R{background:radial-gradient(500px 300px at 100% 0,#eef4f3,#fff)}
  .p3 .card{background:rgba(255,255,255,.82);backdrop-filter:blur(6px)}
  .p3 .card h3 .chip{background:rgba(255,255,255,.6);color:var(--cta)}

  /* P4 · LIGHT two-tone (all paper/white, on-brand) */
  .p4 .L{background:radial-gradient(560px 340px at 16% -5%,rgba(46,154,140,.16),transparent),linear-gradient(180deg,#EAF1F4,var(--paper));color:var(--ink)}
  .p4 .L .eyebrow{color:var(--stamp-t)}.p4 .L .eyebrow::before{background:var(--stamp)}
  .p4 .L h2{color:var(--ink)}.p4 .L .hl{color:var(--red)}
  .p4 .L .intro{color:var(--muted)}
  .p4 .L .sub{color:#8a959d}
  .p4 .freepill{color:var(--stamp-t);background:rgba(46,154,140,.1);border-color:rgba(46,154,140,.3)}
  .p4 .freepill .dot{box-shadow:0 0 8px #25D366}
  .p4 .R{background:#fff;border-left:1px solid var(--edge)}
  .p4 .card{border-top:2px solid transparent}.p4 .card:hover{border-top-color:var(--stamp)}
</style></head><body><div class="wrap">
  <h1>"Before anything else" — premium polish</h1>
  <p class="subx">Refined two-tone: card hover, status chips, free-pill, tighter type. Four finishes.</p>
  <div class="tabs">
    <button class="tab on" onclick="sw(0)">P1 · Teal glow</button>
    <button class="tab" onclick="sw(1)">P2 · Petrol + chips</button>
    <button class="tab" onclick="sw(2)">P3 · Glass cards</button>
    <button class="tab" onclick="sw(3)">P4 · Light two-tone</button>
  </div>
  <div class="panel on"><div class="shell p1" data-shell></div></div>
  <div class="panel"><div class="shell p2" data-shell></div></div>
  <div class="panel"><div class="shell p3" data-shell></div></div>
  <div class="panel"><div class="shell p4" data-shell></div></div>
</div>
<script>
  var WA='<svg class="wa-svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>';
  var C=[['eVisa or share code','Your UKVI account share code is what we check. Send us the code, not a photo of a document.','eV'],['BRP holder','BRPs were replaced by eVisas at the end of 2024. If you still hold the card, we will tell you what proof the consulate wants now.','BRP'],['Student visa','A student file is built differently, not weakly. We will tell you exactly how yours has to be put together.','ST'],['Dependant, spouse or Skilled Worker visa','Same route, different evidence. We will tell you which parts of your file the officer will look at hardest.','DEP']];
  var L='<div class="L"><span class="freepill"><span class="dot"></span>Free check</span><span class="eyebrow">Before anything else</span><h2>Your UK visa does not stop you. <span class="hl">Your passport does not either.</span></h2><p class="intro">Ask a Schengen visa consultant to check your status free, before you pay anything. What matters is that your UK status stays valid for three months after you return. Not which passport you hold.</p><div class="actions"><a class="btn-wa" href="#">'+WA+'Check if I qualify, free</a><p class="sub">No payment, no obligation. A named consultant replies within 30 minutes, 7 days a week.</p></div></div>';
  var cards=C.map(function(c){return '<div class="card"><h3><span class="chip">'+c[2]+'</span>'+c[0]+'</h3><p>'+c[1]+'</p></div>';}).join('');
  var R='<div class="R"><div class="grid">'+cards+'</div><p class="also"><b>Also covered:</b> ILR, EU Settlement Scheme status (settled or presettled), refugee travel document holders, and British citizens.</p></div>';
  document.querySelectorAll('[data-shell]').forEach(function(s){s.innerHTML=L+R;});
  function sw(i){document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('on',j===i);});document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('on',j===i);});}
</script>
</body></html>
