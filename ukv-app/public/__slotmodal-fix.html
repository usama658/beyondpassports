<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slot modal — reconciled counts preview</title>
<style>
:root{--ink:#16222E;--paper:#F4F6FA;--cta:#155E7A;--stamp:#2E9A8C;--stamp-text:#1F6E63;--muted:#5d6b76;--paper-edge:#dde3ec;--display:"Outfit",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--display);color:var(--ink);background:#e9edf1;padding:30px 16px;display:flex;justify-content:center}
.modal{width:560px;max-width:96vw;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px -28px rgba(20,34,46,.5);border:1px solid var(--paper-edge)}
.mhead{padding:20px 22px;background:linear-gradient(135deg,#12233c,#0f4a61);color:#fff}
.mhead .c{font:800 20px var(--display);letter-spacing:-.01em}
.mhead .t{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:#cfe0dd}
.mhead .dot{width:8px;height:8px;border-radius:50%;background:#5fd0be;box-shadow:0 0 0 4px rgba(95,208,190,.25)}
.mhead .tot{font-weight:800;color:#fff}
.body{padding:14px 16px 6px}
.sc-centre{border:1px solid var(--paper-edge);border-radius:14px;margin:0 0 12px;overflow:hidden}
.sc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--paper)}
.sc-name{font:800 14px var(--display);color:var(--ink)}
.sc-num{font:700 11px var(--display);color:var(--stamp-text);background:#fff;border:1px solid #cfe8e3;border-radius:999px;padding:3px 10px;white-space:nowrap}
.sc-slots{display:flex;flex-wrap:wrap;gap:8px;padding:16px}
.sc-more{font-size:12px;color:var(--muted);margin:0;padding:0 16px 14px}
.slot{position:relative;min-width:74px;text-align:center;border:1.5px solid var(--paper-edge);border-radius:12px;padding:9px 12px 10px;cursor:pointer;background:#f7fafb;transition:.12s}
.slot:hover{border-color:var(--stamp);background:#fff}
.slot .soon{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font:800 8px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--stamp);border-radius:999px;padding:2px 7px;white-space:nowrap}
.slot .wd{display:block;font:700 10px var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slot .dm{display:block;font:800 13px var(--display);color:var(--ink);margin-top:1px}
.foot{padding:6px 16px 20px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0 0 12px}
.book{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#25D366;color:#fff;border:0;border-radius:12px;padding:14px;font:800 15px var(--display);cursor:pointer}
</style></head>
<body>
<div class="modal">
  <div class="mhead">
    <div class="c">Germany — pick your appointment day</div>
    <div class="t"><span class="dot"></span><span class="tot">30 slots</span> in the next 30 days across 3 centres · Available</div>
  </div>
  <div class="body" id="b"></div>
  <div class="foot">
    <p class="note">Indicative only. We confirm the exact time live with the centre before you pay.</p>
    <button class="book"><svg viewBox="0 0 32 32" width="18" height="18" fill="#fff"><path d="M16 3a13 13 0 0 0-11 20L3 29l6-2A13 13 0 1 0 16 3z"/></svg>Select a day to book</button>
  </div>
</div>
<script>
// Sample reconciled data: per-centre "open" = true 30-day count; sums to 30 (matches header).
var centres = [
  { name:'Germany visa application centre – London',    open:12, days:['Thu 31 Jul','Fri 1 Aug','Mon 4 Aug','Tue 5 Aug','Thu 7 Aug','Fri 8 Aug'] },
  { name:'Germany visa application centre – Manchester', open:10, days:['Fri 1 Aug','Wed 6 Aug','Thu 7 Aug','Mon 11 Aug','Wed 13 Aug','Fri 15 Aug'] },
  { name:'Germany visa application centre – Edinburgh',  open:8,  days:['Mon 4 Aug','Tue 5 Aug','Thu 14 Aug','Mon 18 Aug'] }
];
var b = document.getElementById('b'); var first = true;
centres.forEach(function(c){
  var n = c.days.length, openN = c.open;
  var card = document.createElement('div'); card.className='sc-centre';
  card.innerHTML = '<div class="sc-head"><span class="sc-name">'+c.name+'</span><span class="sc-num">'+openN+' open</span></div>';
  var row = document.createElement('div'); row.className='sc-slots';
  c.days.forEach(function(d,i){
    var p=d.split(' '), wd=p[0], dm=p.slice(1).join(' ');
    var btn=document.createElement('button'); btn.className='slot';
    btn.innerHTML=(first&&i===0?'<span class="soon">Soonest</span>':'')+'<span class="wd">'+wd+'</span><span class="dm">'+dm+'</span>';
    row.appendChild(btn);
  });
  card.appendChild(row);
  if(openN>n){ var m=document.createElement('p'); m.className='sc-more'; m.textContent='Showing the '+n+' soonest days — more times available, confirmed live when you book.'; card.appendChild(m); }
  b.appendChild(card); first=false;
});
</script>
</body></html>
