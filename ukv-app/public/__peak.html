<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peak stub — full-width desktop options + mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--display:"Outfit",system-ui,sans-serif;--ink:#16222E;--muted:#5d6b76;--edge:#dde3ec}
*{box-sizing:border-box}
body{margin:0;background:#e9eef2;font-family:var(--display);padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.lab{font:800 12px/1.4 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#5a6874;margin-top:18px}
.phone{width:390px;max-width:94vw;background:#F4F6FA;border:1px solid var(--edge);border-radius:26px;box-shadow:0 30px 70px -34px rgba(20,34,46,.5);padding:20px 16px 26px}
.deskwrap{width:1000px;max-width:96vw;background:#F4F6FA;border:1px solid var(--edge);border-radius:16px;padding:26px 24px}

.blink-dot{position:absolute;top:12px;right:14px;width:9px;height:9px;border-radius:50%;background:#e11d1d;z-index:3;animation:blink 1.1s ease-in-out infinite}
.blink-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(225,29,29,.45);animation:ring 1.1s ease-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.6);opacity:.85}100%{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){.blink-dot,.blink-dot::after{animation:none}}

.stub{position:relative;width:100%;background:#fff;color:var(--ink);border:1px solid #e6ebf1;border-radius:14px;box-shadow:0 12px 30px -20px rgba(20,34,46,.45)}
.stub .a{font:800 11px var(--display);letter-spacing:.18em;text-transform:uppercase;color:#8a97a0}
.stub .b{font:800 27px var(--display);line-height:1;color:var(--ink)}
.stub .c{font:800 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:#b5791f}
.stub .row{display:flex;align-items:baseline;gap:12px;padding:18px 26px}

/* mobile full-width, centred */
.stub.m .row{justify-content:center}
.stub.m .b{font-size:20px}

/* D1 centred */
.stub.d1 .row{justify-content:center}
/* D2 left */
.stub.d2 .row{justify-content:flex-start}
/* D3 space-between: Season+PEAK left, Jul–Aug pinned right */
.stub.d3 .row{justify-content:space-between}
.stub.d3 .left{display:flex;align-items:baseline;gap:12px}
</style></head>
<body>

<div class="lab">Mobile · stub full-width · dot + ring (B)</div>
<div class="phone"><span class="stub m"><span class="blink-dot"></span><span class="row"><span class="a">Season</span><span class="b">PEAK</span><span class="c">Jul–Aug</span></span></span></div>

<div class="lab">Desktop D1 · full-width · centred</div>
<div class="deskwrap"><span class="stub d1"><span class="blink-dot"></span><span class="row"><span class="a">Season</span><span class="b">PEAK</span><span class="c">Jul–Aug</span></span></span></div>

<div class="lab">Desktop D2 · full-width · left-aligned</div>
<div class="deskwrap"><span class="stub d2"><span class="blink-dot"></span><span class="row"><span class="a">Season</span><span class="b">PEAK</span><span class="c">Jul–Aug</span></span></span></div>

<div class="lab">Desktop D3 · full-width · split (Season PEAK left · Jul–Aug right)</div>
<div class="deskwrap"><span class="stub d3"><span class="blink-dot"></span><span class="row"><span class="left"><span class="a">Season</span><span class="b">PEAK</span></span><span class="c">Jul–Aug</span></span></span></div>

<div style="height:44px"></div>
</body></html>
