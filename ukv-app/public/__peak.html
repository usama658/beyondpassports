<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peak stub - mobile preview</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--display:"Outfit",system-ui,sans-serif}
body{margin:0;background:#e9eef2;font-family:var(--display);padding:30px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.lab{font:800 12px/1.4 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#5a6874}
/* phone frame ~390px */
.phone{width:390px;max-width:94vw;background:#F4F6FA;border:1px solid #dde3ec;border-radius:26px;box-shadow:0 30px 70px -34px rgba(20,34,46,.5);padding:20px 16px 26px;overflow:hidden}

/* ===== the stub tile (mobile row style) + red blinking dot ===== */
.pp-stub{position:relative;background:#fff;color:#16222E;display:flex;flex-direction:row;align-items:baseline;justify-content:center;gap:9px;
  padding:14px 16px;text-align:center;border-radius:14px;border:1px solid #e6ebf1;box-shadow:0 10px 26px -18px rgba(20,34,46,.4)}
.pp-stub .a{font:800 10px var(--display);letter-spacing:.16em;text-transform:uppercase;color:#8a97a0}
.pp-stub .b{font:800 20px var(--display);line-height:1;color:#16222E}
.pp-stub .c{font:800 10px var(--display);letter-spacing:.12em;text-transform:uppercase;color:#b5791f}

/* red blinking dot, top-right corner */
.blink-dot{position:absolute;top:9px;right:10px;width:11px;height:11px;border-radius:50%;background:#e11d1d;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(225,29,29,.55)}50%{opacity:.3;box-shadow:0 0 0 7px rgba(225,29,29,0)}}
@media(prefers-reduced-motion:reduce){.blink-dot{animation:none}}

/* variant B: dot with a "LIVE" style ring, slightly bigger */
.pp-stub.v2 .blink-dot{width:9px;height:9px;top:10px;right:11px}
.pp-stub.v2 .blink-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(225,29,29,.4);animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
</style></head>
<body>

<div class="lab">Mobile · stub only · red blinking dot (A)</div>
<div class="phone">
  <span class="pp-stub">
    <span class="blink-dot" aria-hidden="true"></span>
    <span class="a">Season</span><span class="b">PEAK</span><span class="c">Jul–Aug</span>
  </span>
</div>

<div class="lab" style="margin-top:20px">Mobile · variant B · dot + pulsing ring</div>
<div class="phone">
  <span class="pp-stub v2">
    <span class="blink-dot" aria-hidden="true"></span>
    <span class="a">Season</span><span class="b">PEAK</span><span class="c">Jul–Aug</span>
  </span>
</div>

</body></html>
