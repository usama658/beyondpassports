<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peak stub — mobile + desktop preview (dot + ring)</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--display:"Outfit",system-ui,sans-serif;--ink:#16222E;--muted:#5d6b76;--edge:#dde3ec}
*{box-sizing:border-box}
body{margin:0;background:#e9eef2;font-family:var(--display);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lab{font:800 12px/1.4 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#5a6874;margin-top:18px}
.phone{width:390px;max-width:94vw;background:#F4F6FA;border:1px solid var(--edge);border-radius:26px;box-shadow:0 30px 70px -34px rgba(20,34,46,.5);padding:20px 16px 26px}
.deskwrap{width:940px;max-width:96vw;background:#fff;border:1px solid var(--edge);border-radius:16px;padding:28px 24px}
.deskwrap .cap{color:var(--muted);font-size:13px;margin:0 0 18px}

/* red blinking dot + pulsing ring (variant B) */
.blink-dot{position:absolute;top:10px;right:12px;width:9px;height:9px;border-radius:50%;background:#e11d1d;z-index:3;animation:blink 1.1s ease-in-out infinite}
.blink-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(225,29,29,.45);animation:ring 1.1s ease-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.6);opacity:.85}100%{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){.blink-dot,.blink-dot::after{animation:none}}

/* stub tile — shared base */
.stub{position:relative;background:#fff;color:var(--ink);border:1px solid #e6ebf1;border-radius:14px;
  display:flex;align-items:baseline;justify-content:center;gap:10px;text-align:center;box-shadow:0 12px 30px -20px rgba(20,34,46,.45)}
.stub .a{font:800 10px var(--display);letter-spacing:.16em;text-transform:uppercase;color:#8a97a0}
.stub .b{font:800 var(--display);line-height:1;color:var(--ink)}
.stub .c{font:800 10px var(--display);letter-spacing:.12em;text-transform:uppercase;color:#b5791f}

/* mobile: full-width row */
.stub.m{padding:14px 16px}
.stub.m .b{font-size:20px}

/* desktop: full section width, larger PEAK */
.stub.d{padding:18px 28px;width:100%}
.stub.d .a{font-size:11px}
.stub.d .b{font-size:27px}
.stub.d .c{font-size:11px}
</style></head>
<body>

<div class="lab">Mobile · stub only · dot + pulsing ring (B)</div>
<div class="phone">
  <span class="stub m">
    <span class="blink-dot" aria-hidden="true"></span>
    <span class="a">Season</span><span class="b">PEAK</span><span class="c">Jul–Aug</span>
  </span>
</div>

<div class="lab">Desktop · same stub only · dot + pulsing ring</div>
<div class="deskwrap">
  <p class="cap">Desktop shows the same compact stub tile (not the full boarding-pass), dot top-right.</p>
  <span class="stub d">
    <span class="blink-dot" aria-hidden="true"></span>
    <span class="a">Season</span><span class="b">PEAK</span><span class="c">Jul–Aug</span>
  </span>
</div>

<div style="height:40px"></div>
</body></html>
